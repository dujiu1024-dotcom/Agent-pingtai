name: platform-integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres-redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_PLATFORM_TEST_DSN: postgresql://platform:platform@localhost:5432/platform_test
      AGENT_PLATFORM_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "redis>=5,<7" "langgraph>=1.0,<2.0"
      - name: Run PostgreSQL and Redis integration tests
        run: python -m unittest tests.test_platform_postgres_integration tests.test_quota_postgres_integration tests.test_legacy_identity_migration tests.test_tenant_creation_integration tests.test_service_identity_authorization_integration tests.test_knowledge_memory_postgres_integration tests.test_redis_streams_integration tests.test_issue_18_a_18_03_redis_outbox_recovery_integration tests.test_gateway_runtime_postgres_integration tests.test_task_center_interventions_postgres_integration tests.test_file_processing_postgres_integration tests.test_connector_cleanup_postgres_integration tests.test_reliability_fault_injection -v
