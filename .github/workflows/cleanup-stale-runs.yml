name: cleanup-stale-runs

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-stale-runs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel obsolete queued and running checks
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const currentSha = context.sha;
            const activeStates = new Set(['queued', 'pending', 'waiting', 'requested', 'in_progress']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100,
            });
            const stale = runs.filter(run =>
              run.id !== context.runId &&
              run.head_branch === branch &&
              run.head_sha !== currentSha &&
              activeStates.has(run.status)
            );
            core.info(`Found ${stale.length} obsolete active run(s) on ${branch}; current commit ${currentSha} is preserved.`);
            let cancelled = 0;
            for (const run of stale) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                cancelled += 1;
                core.info(`Cancelled ${run.name} #${run.run_number} (${run.head_sha}).`);
              } catch (error) {
                core.warning(`Could not cancel run ${run.id}: ${error.message}`);
              }
            }
            core.notice(`Cancelled ${cancelled} obsolete run(s); current commit checks were not touched.`);
