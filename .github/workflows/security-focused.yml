name: security-focused

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-focused-${{ github.event.pull_request.number || github.ref }}
  # Never cancel in-progress runs: a dense push burst would otherwise create a
  # cancel-loop where every new workflow tears down the previous one before
  # the runner even starts, leaving everything queued forever.
  cancel-in-progress: true

jobs:
  security-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-platform.txt
      - name: Run security and approval unit tests
        run: |
          python -m unittest \
            tests.test_approval_service \
            tests.test_approval_timeouts \
            tests.test_identity_audit_contract \
            tests.test_secret_manager \
            tests.test_secret_supply_chain \
            tests.test_secret_log_redaction \
            tests.test_approval_workbench_ui \
            tests.test_sandbox_oci \
            tests.test_runtime_permission_guard \
            tests.test_runtime_security_auto_response \
            tests.test_emergency_isolation \
            tests.test_issue_21_c_21_02_security_negative \
            tests.test_issue_12_a_12_02_security_acceptance -v
