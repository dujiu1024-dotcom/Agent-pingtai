name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect platform code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(agent_platform/|tests/|scripts/|frontend/|requirements[^/]*\.txt$|pyproject\.toml$|mypy\.ini$|ruff\.toml$|Dockerfile|docker/|deploy/|compose[^/]*\.ya?ml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  docs-validation:
    name: Docs and workflow validation
    needs: changes
    if: needs.changes.outputs.platform != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and patch integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' .github/workflows/ci.yml .github/workflows/platform-release-gate.yml

  identity-focused:
    name: Identity focused tests (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements-platform.txt "httpx>=0.27,<1"
      - name: Run identity and tenant-isolation unit/API tests
        run: >-
          python -m unittest
          tests.test_identity
          tests.test_identity_api
          tests.test_identity_context
          tests.test_identity_http
          tests.test_service_identity
          tests.test_legacy_identity_audit
          tests.test_legacy_identity_revoke
          tests.test_legacy_identity_migration
          tests.test_platform_api_app
          tests.test_issue_755_c_dual_mode_integration
          -v

  test:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip ruff mypy
      - name: Install optional dependencies
        run: python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  platform-integration:
    name: Platform Integration
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/platform-integration.yml
