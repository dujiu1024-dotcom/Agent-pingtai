name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect platform code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(agent_platform/|tests/|scripts/|frontend/|requirements[^/]*\.txt$|pyproject\.toml$|mypy\.ini$|ruff\.toml$|Dockerfile|docker/|deploy/|compose[^/]*\.ya?ml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  docs-validation:
    name: Docs and workflow validation
    needs: changes
    if: needs.changes.outputs.platform != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed documentation and configuration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import os

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...{head}"], text=True
          ).splitlines()
          for name in changed:
              path = Path(name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"changed file is missing or empty: {name}")
              path.read_bytes().decode("utf-8")
          print(f"validated {len(changed)} changed UTF-8 files")
          PY
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' .github/workflows/ci.yml .github/workflows/platform-release-gate.yml

  identity-focused:
    name: Identity focused tests (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install platform test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements-platform.txt "httpx>=0.27,<1" pytest
      - name: Run identity and tenant-isolation unit/API tests
        run: >-
          python -m unittest
          tests.test_identity
          tests.test_identity_api
          tests.test_identity_context
          tests.test_identity_http
          tests.test_service_identity
          tests.test_legacy_identity_audit
          tests.test_legacy_identity_revoke
          tests.test_legacy_identity_migration
          tests.test_platform_api_app
          tests.test_issue_755_c_dual_mode_integration
          -v

  offline-policy:
    name: Offline policy tests
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run offline policy unit tests
        run: python -m unittest tests.test_offline_policy -v
      - name: Lint offline policy files
        run: >-
          ruff check
          agent_platform/resilience/offline_policy.py
          agent_platform/resilience/__init__.py
          tests/test_offline_policy.py

  hybrid-control-plane:
    name: Hybrid control-plane handoff tests
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ruff
        run: python -m pip install ruff pytest
      - name: Run hybrid control-plane tests
        run: python -m unittest tests.test_hybrid_control_plane -v
      - name: Lint hybrid control-plane files
        run: >-
          ruff check
          agent_platform/resilience/hybrid_control_plane.py
          agent_platform/resilience/__init__.py
          tests/test_hybrid_control_plane.py

  test:
    needs: [changes, lint, typecheck]
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - name: Install optional dependencies
        run: python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -q

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-platform.txt
      - name: Install lint dependency
        run: python -m pip install ruff
      - name: Run Ruff on changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- '*.py')"
          else
            changed="$(git ls-files '*.py')"
          fi
          if [[ -z "$changed" ]]; then
            echo "No changed Python files to lint."
            exit 0
          fi
          printf '%s\n' "$changed" | xargs ruff check

  typecheck:
    name: Type check
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-platform.txt
            requirements-knowledge-parsers.txt
            requirements-harness-strands.txt
      - name: Install type-check dependencies
        run: python -m pip install mypy -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt
      - name: Run Mypy
        run: mypy

  platform-integration:
    name: Platform Integration
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/platform-integration.yml
