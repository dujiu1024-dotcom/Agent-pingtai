name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale runs for the same branch/PR so squash-merged branches don't
  # leave zombie runners blocking new CI indefinitely.
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          python - <<'PY'
          import os, subprocess
          files = subprocess.check_output(["git", "diff", "--name-only", f"{base}...HEAD"], text=True).splitlines()
          docs_only = bool(files) and all(path.startswith("docs/") or path.lower().endswith((".md", ".markdown", ".rst")) or path in {"LICENSE", "CHANGELOG", "CONTRIBUTING"} for path in files)
          print("Changed files:", files)
          print("Documentation-only:", docs_only)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(not docs_only).lower()}\n")
          PY

  identity-focused:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Identity focused tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-platform.txt
      - name: Install platform test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements-platform.txt "httpx>=0.27,<1"
      - name: Run identity and tenant-isolation unit/API tests
        run: >-
          python -m unittest
          tests.test_identity
          tests.test_identity_api
          tests.test_identity_context
          tests.test_identity_http
          tests.test_service_identity
          tests.test_legacy_identity_audit
          tests.test_legacy_identity_revoke
          tests.test_legacy_identity_migration
          tests.test_platform_api_app
          tests.test_issue_755_c_dual_mode_integration
          -v

  test:
    needs: [changes, lint, typecheck]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-platform.txt
            requirements-knowledge-parsers.txt
            requirements-harness-strands.txt
      - name: 安装测试依赖
        run: python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest
      - name: 单元测试（全量）
        run: python -m unittest discover -s tests -t . -q

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependency
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check .

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install type-check dependencies
        run: python -m pip install mypy -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt
      - name: Run Mypy
        run: mypy

  platform-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Platform Integration
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    uses: ./.github/workflows/platform-integration.yml
