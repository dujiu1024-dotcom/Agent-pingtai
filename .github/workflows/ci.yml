name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale runs for the same branch/PR so squash-merged branches don't
  # leave zombie runners blocking new CI indefinitely.
  cancel-in-progress: true

jobs:
  identity-focused:
    name: Identity focused tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-platform.txt
      - name: Install platform test dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements-platform.txt "httpx>=0.27,<1"
      - name: Run identity and tenant-isolation unit/API tests
        run: >-
          python -m unittest
          tests.test_identity
          tests.test_identity_api
          tests.test_identity_context
          tests.test_identity_http
          tests.test_service_identity
          tests.test_legacy_identity_audit
          tests.test_legacy_identity_revoke
          tests.test_legacy_identity_migration
          tests.test_platform_api_app
          tests.test_issue_755_c_dual_mode_integration
          -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-platform.txt
            requirements-knowledge-parsers.txt
            requirements-harness-strands.txt
      - name: 安装测试依赖
        run: python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest
      - name: 单元测试（全量）
        run: python -m unittest discover -s tests -t . -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependency
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install type-check dependencies
        run: python -m pip install mypy -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt
      - name: Run Mypy
        run: mypy

  platform-integration:
    name: Platform Integration
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    uses: ./.github/workflows/platform-integration.yml
