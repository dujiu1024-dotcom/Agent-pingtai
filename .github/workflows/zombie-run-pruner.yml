name: zombie-run-pruner

# Periodically cancel only genuinely orphaned or stale workflow runs.
# Open PR branches are always protected from age-based cancellation.
# This workflow is deliberately schedule/manual only: workflow_run fan-out
# caused one extra runner job for every completed CI workflow.

on:
  schedule:
    # Every 30 minutes; cleanup is maintenance, not part of the PR critical path.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: zombie-run-pruner
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repository for remote branch checks
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find and cancel orphaned workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_MINUTES: 120
          REPO: ${{ github.repository }}
        run: |
          set -u

          echo "Scanning in-progress workflow runs (age threshold: ${MAX_AGE_MINUTES}m)..."

          # A live PR is authoritative: never cancel its runs based on age.
          pr_branches=$(gh pr list --state open --limit 1000 \
            --repo "$REPO" --json headRefName -q '.[].headRefName' 2>/dev/null || true)

          cutoff_epoch=$(( $(date +%s) - MAX_AGE_MINUTES * 60 ))
          canceled=0
          kept=0

          while IFS='|' read -r run_id name branch created; do
            [ -z "$run_id" ] && continue

            case "$branch" in
              main|master) kept=$((kept + 1)); continue ;;
            esac

            # Critical safety invariant: open PR branches are never pruned,
            # even when a legitimate integration test exceeds the age limit.
            if printf '%s\n' "$pr_branches" | grep -Fxq "$branch"; then
              kept=$((kept + 1))
              continue
            fi

            reason=""

            # A run whose branch no longer exists and has no open PR is orphaned.
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              reason="branch deleted"
            else
              ts="${created%Z}"
              run_epoch=$(date -d "$ts" +%s 2>/dev/null || echo 0)
              if [ "$run_epoch" -gt 0 ] && [ "$run_epoch" -lt "$cutoff_epoch" ]; then
                run_age=$(( ( $(date +%s) - run_epoch ) / 60 ))
                reason="stale run age ${run_age}m > ${MAX_AGE_MINUTES}m"
              fi
            fi

            if [ -n "$reason" ]; then
              if gh run cancel "$run_id" --repo "$REPO" 2>/dev/null; then
                echo "Canceled #$run_id  $name  $branch  ($reason)"
                canceled=$((canceled + 1))
              else
                echo "Could not cancel #$run_id  $name"
              fi
            else
              kept=$((kept + 1))
            fi
          done < <(gh run list --status in_progress --limit 100 --repo "$REPO" \
            --json databaseId,name,headBranch,createdAt \
            -q '.[] | "\(.databaseId)|\(.name)|\(.headBranch)|\(.createdAt)"' 2>/dev/null || true)

          echo "Cleanup complete: canceled=$canceled kept=$kept"
