name: C5 real test execution matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-test-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-core:
    name: Backend tests + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            run-full-suite: true
          - python-version: "3.12"
            run-full-suite: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage ruff mypy
          python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest

      - name: Run focused identity and tenant tests
        shell: bash
        run: |
          python -m unittest \
            tests.test_identity \
            tests.test_identity_api \
            tests.test_identity_context \
            tests.test_identity_http \
            tests.test_service_identity \
            tests.test_legacy_identity_audit \
            tests.test_legacy_identity_revoke \
            tests.test_legacy_identity_migration \
            tests.test_platform_api_app \
            tests.test_issue_755_c_dual_mode_integration \
            -v

      - name: Run full unittest suite with branch coverage (Python 3.11)
        # Run the full suite even when focused checks fail; keep the job failed via the focused step.
        if: always() && matrix.run-full-suite
        shell: bash
        run: |
          set +e
          coverage run --branch --source=agent_platform -m unittest discover -s tests -t . -v
          full_status=$?
          echo "Full unittest + coverage exit code: ${full_status}"

          coverage report -m
          report_status=$?
          coverage xml -o coverage.xml
          xml_status=$?

          if [ "${full_status}" -ne 0 ] || [ "${report_status}" -ne 0 ] || [ "${xml_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload backend coverage
        if: always() && matrix.run-full-suite
        uses: actions/upload-artifact@v4
        with:
          name: c5-backend-coverage-py${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend npm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock
      - name: Run requested production build
        working-directory: frontend
        run: npm run build
