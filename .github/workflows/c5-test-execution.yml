name: C5 real test execution matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-test-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-core:
    name: Backend core tests + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage ruff mypy
          python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt pytest
      - name: Identity and tenant authorization tests
        run: >-
          python -m unittest
          tests.test_identity
          tests.test_identity_api
          tests.test_identity_context
          tests.test_identity_http
          tests.test_service_identity
          tests.test_legacy_identity_audit
          tests.test_legacy_identity_revoke
          tests.test_legacy_identity_migration
          tests.test_platform_api_app
          tests.test_issue_755_c_dual_mode_integration
          -v
      - name: Full unittest suite with coverage
        run: |
          coverage run --branch --source=agent_platform -m unittest discover -s tests -t . -q
          coverage report -m
          coverage xml -o coverage.xml
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-backend-coverage-py${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend npm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock
      - name: Run requested production build
        working-directory: frontend
        run: npm run build
