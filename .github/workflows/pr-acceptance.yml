name: pr-acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: PR Acceptance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for all required CI workflows
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['ci', 'platform-ci', 'platform-integration'];
            const prNumber = context.payload.pull_request.number;
            const expectedSha = context.sha;
            const deadline = Date.now() + 50 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'pull_request',
                per_page: 100,
              });
              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === expectedSha &&
                (run.pull_requests || []).some(pull => pull.number === prNumber)
              );

              const states = required.map(name => {
                const matching = runs
                  .filter(run => run.name === name)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return { name, run: matching[0] };
              });

              core.info(JSON.stringify(states.map(({ name, run }) => ({
                name,
                status: run?.status || 'waiting-for-trigger',
                conclusion: run?.conclusion || null,
                url: run?.html_url || null,
              }))));

              const missing = states.filter(item => !item.run);
              if (missing.length === 0) {
                const unfinished = states.filter(item => item.run.status !== 'completed');
                if (unfinished.length === 0) {
                  const failed = states.filter(item => item.run.conclusion !== 'success');
                  if (failed.length) {
                    core.setFailed(`Required CI did not pass: ${failed.map(item => `${item.name}=${item.run.conclusion}`).join(', ')}`);
                    return;
                  }
                  core.info('All required CI workflows passed for this PR revision.');
                  return;
                }
              }
              await sleep(15000);
            }
            core.setFailed('Timed out waiting for ci, platform-ci, and platform-integration to finish for this PR revision.');
