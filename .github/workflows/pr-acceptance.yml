name: pr-acceptance

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: PR Acceptance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for platform CI on this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['platform-ci', 'platform-integration'];
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const sha = context.sha;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 100,
            });
            if (prs.data.length === 0) {
              core.info(`No open PR uses ${branch}; acceptance gate is not applicable.`);
              return;
            }
            const prNumbers = prs.data.map(pr => pr.number);
            core.info(`Checking PR(s) ${prNumbers.join(', ')} at ${sha}.`);
            const deadline = Date.now() + 50 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'push',
                branch,
                per_page: 100,
              });
              const runs = response.data.workflow_runs.filter(run => run.head_sha === sha);
              const states = required.map(name => {
                const matching = runs
                  .filter(run => run.name === name)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return { name, run: matching[0] };
              });
              core.info(JSON.stringify(states.map(({ name, run }) => ({
                name,
                status: run?.status || 'waiting-for-trigger',
                conclusion: run?.conclusion || null,
                url: run?.html_url || null,
              }))));
              if (states.every(item => item.run)) {
                const unfinished = states.filter(item => item.run.status !== 'completed');
                if (unfinished.length === 0) {
                  const failed = states.filter(item => item.run.conclusion !== 'success');
                  if (failed.length) {
                    core.setFailed(`Platform acceptance failed: ${failed.map(item => `${item.name}=${item.run.conclusion}`).join(', ')}`);
                    return;
                  }
                  const legacy = runs.find(run => run.name === 'ci');
                  if (!legacy || legacy.conclusion !== 'success') {
                    core.warning('Legacy full-suite CI is informational only because the repository baseline has known pre-existing failures.');
                  }
                  core.info('Platform CI and PostgreSQL/Redis integration passed for this commit.');
                  return;
                }
              }
              await sleep(15000);
            }
            core.setFailed('Timed out waiting for platform-ci and platform-integration for this commit.');
