name: platform-ci

on:
  push:
    paths:
      - "agent_platform/**"
      - "tests/test_platform_contracts.py"
      - "tests/test_event_consumer.py"
      - "tests/test_tool_gateway.py"
      - "tests/test_outbox.py"
      - "tests/test_multi_expert_routing.py"
      - "tests/test_mcp_adapter.py"
      - "tests/test_model_templates.py"
      - "tests/test_deepseek_harness_adapter.py"
      - "tests/test_strands_agents_adapter.py"
      - "tests/test_harness_benchmark.py"
      - "requirements-platform.txt"
      - "requirements-harness-dsh.txt"
      - "requirements-harness-strands.txt"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "agent_platform/**"
      - "tests/test_platform_contracts.py"
      - "tests/test_event_consumer.py"
      - "tests/test_tool_gateway.py"
      - "tests/test_outbox.py"
      - "tests/test_multi_expert_routing.py"
      - "tests/test_mcp_adapter.py"
      - "tests/test_model_templates.py"
      - "tests/test_deepseek_harness_adapter.py"
      - "tests/test_strands_agents_adapter.py"
      - "tests/test_harness_benchmark.py"
      - "requirements-platform.txt"
      - "requirements-harness-dsh.txt"
      - "requirements-harness-strands.txt"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"

jobs:
  platform-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip ruff mypy
      - name: 平台领域与审批策略测试
        run: python -m unittest tests.test_platform_contracts tests.test_tool_gateway tests.test_outbox tests.test_multi_expert_routing tests.test_mcp_adapter tests.test_model_templates tests.test_deepseek_harness_adapter tests.test_strands_agents_adapter tests.test_harness_benchmark tests.test_event_consumer -v
      - name: 平台代码 Lint
        run: ruff check agent_platform tests/test_platform_contracts.py tests/test_tool_gateway.py tests/test_outbox.py tests/test_multi_expert_routing.py tests/test_mcp_adapter.py tests/test_model_templates.py tests/test_deepseek_harness_adapter.py tests/test_strands_agents_adapter.py tests/test_harness_benchmark.py tests/test_event_consumer.py tests/test_platform_postgres_integration.py tests/test_redis_streams_integration.py
      - name: 平台接口类型检查
        run: mypy

  strands-sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Strands runtime
        run: python -m pip install -r requirements-harness-strands.txt
      - name: Verify Strands and OpenAI-compatible model adapter APIs
        run: >-
          python -c 'from strands import Agent; from strands.models.openai import OpenAIModel;
          model = OpenAIModel(model_id="smoke-model", client_args={"api_key":"scoped-proxy-token","base_url":"http://127.0.0.1:1/v1"}, params={"max_tokens":32});
          agent = Agent(model=model, tools=[], load_tools_from_directory=False, plugins=[], callback_handler=None, context_manager=False);
          agent.shutdown()'
