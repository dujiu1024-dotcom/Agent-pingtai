name: platform-ci

on:
  push:
    paths:
      - "agent_platform/**"
      - "tests/test_platform_contracts.py"
      - "requirements-platform.txt"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "agent_platform/**"
      - "tests/test_platform_contracts.py"
      - "requirements-platform.txt"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"

jobs:
  platform-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip ruff mypy
      - name: 平台领域与审批策略测试
        run: python -m unittest tests.test_platform_contracts -v
      - name: 平台代码 Lint
        run: ruff check agent_platform tests/test_platform_contracts.py
      - name: 平台接口类型检查
        run: mypy
