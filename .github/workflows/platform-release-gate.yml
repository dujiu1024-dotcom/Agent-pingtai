name: platform-release-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_evidence:
        description: "Complete release evidence JSON (see docs/release/RELEASE_EVIDENCE_TEMPLATE.json)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect platform code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(agent_platform/|tests/|scripts/|frontend/|requirements[^/]*\.txt$|pyproject\.toml$|mypy\.ini$|ruff\.toml$|Dockerfile|docker/|deploy/|compose[^/]*\.ya?ml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  docs-validation:
    name: Docs and workflow validation
    needs: changes
    if: needs.changes.outputs.platform != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed documentation and configuration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import os

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...{head}"], text=True
          ).splitlines()
          for name in changed:
              path = Path(name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"changed file is missing or empty: {name}")
              path.read_bytes().decode("utf-8")
          print(f"validated {len(changed)} changed UTF-8 files")
          PY
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file) }' .github/workflows/ci.yml .github/workflows/platform-release-gate.yml

  e2e-security-integration:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_PLATFORM_TEST_DSN: postgresql://platform:platform@localhost:5432/platform_test
      AGENT_PLATFORM_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age
      - name: Install platform test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt
      - name: Execute Issue 666 disposable staging import, zero-diff and rollback drill
        run: |
          python scripts/issue_666_l4_t08_staging_drill.py \
            --dsn "$AGENT_PLATFORM_TEST_DSN" \
            --evidence issue-666-l4-t08-staging-drill.json
      - name: Upload Issue 666 staging and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-666-l4-t08-staging-rollback-evidence
          path: issue-666-l4-t08-staging-drill.json
          if-no-files-found: warn
      - name: Run Issue 665 switch end-to-end, fault, migration and performance contracts
        env:
          AGENT_PLATFORM_BENCH_DSN: postgresql://platform:platform@localhost:5432/platform_test
          AGENT_PLATFORM_BENCH_REDIS_URL: redis://localhost:6379/0
        run: |
          python -m unittest \
            tests.test_issue_665_s_665_01_e2e \
            tests.test_issue_665_s_665_02_benchmark \
            tests.test_issue_665_s_665_03_fault_drill \
            tests.test_issue_665_s_665_04_migration_acceptance \
            tests.test_issue_665_a_665_06_performance_parity \
            tests.test_issue_665_a_665_07_fault_degradation \
            tests.test_migration_batches -v
          python scripts/switch_core_acceptance.py
          python scripts/benchmark_switch_performance.py --workers 8 --operations 100 > switch-performance-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("switch-performance-benchmark.json").read_text(encoding="utf-8"))
          assert report["legacy_sqlite"]["run_lifecycle_transaction"]["operations"] == 800
          assert report["legacy_sqlite"]["blackboard_write_read"]["operations"] == 800
          assert report["platform_postgres_pool"]["status"] == "measured", report["platform_postgres_pool"]
          postgres_metrics = report["platform_postgres_pool"]["metrics"]
          assert postgres_metrics["run_lifecycle_transaction"]["operations"] == 800
          assert postgres_metrics["blackboard_write_read"]["operations"] == 800
          assert postgres_metrics["pool_wait_latency_ms"]["p95"] >= 0
          assert report["platform_redis_queue"]["status"] == "measured", report["platform_redis_queue"]
          assert report["platform_redis_queue"]["metrics"]["messages"] == 800
          print("SWITCH_BENCHMARK=MEASURED (ephemeral CI PostgreSQL/Redis + synthetic SQLite baseline)")
          print("SWITCH_PARITY=INCOMPLETE (not a same-hardware production workload comparison)")
          PY
      - name: Upload Issue 665 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-665-switch-benchmark
          path: switch-performance-benchmark.json
          if-no-files-found: warn
      - name: End-to-end, fault-recovery and security regression suites
        run: |
          python -m unittest \
            tests.test_platform_e2e_release_gate \
            tests.test_issue_763_h4_approval_evaluation_contract \
            tests.test_core_business_journey_e2e \
            tests.test_release_gate_evidence \
            tests.test_identity_api \
            tests.test_identity_http \
            tests.test_knowledge_memory_api \
            tests.test_knowledge_acl_propagation \
            tests.test_memory_boundaries \
            tests.test_graph_governance \
            tests.test_issue_22_a_22_05_benchmark_contract \
            tests.test_graph_admin_api \
            tests.test_graph_workbench_ui \
            tests.test_memory_extraction_preflight \
            tests.test_multi_expert_workflow_integration \
            tests.test_tool_gateway \
            tests.test_sandbox_oci \
            tests.test_issue_21_c_21_02_security_negative \
            tests.test_run_lifecycle \
            tests.test_event_consumer \
            tests.test_session_message_pagination \
            tests.test_issue_21_c_21_03_fault_injection \
            tests.test_issue_21_c_21_04_quality_capacity \
            tests.test_agent_rag_evaluation \
            tests.test_knowledge_evaluation_dataset \
            tests.test_prompt_variants tests.test_prompt_store tests.test_prompt_management_api tests.test_prompt_api \
            tests.test_harness_benchmark_metrics \
            tests.test_outbox \
            tests.test_connector_framework \
            tests.test_backup_recovery_scripts \
            tests.test_gateway_runtime_postgres_integration \
            tests.test_platform_postgres_integration \
            tests.test_postgres_langgraph_checkpoint_integration \
            tests.test_postgres_redis_worker_recovery_integration \
            tests.test_postgres_backup_restore_integration \
            tests.test_tenant_creation_integration \
            tests.test_service_identity_authorization_integration \
            tests.test_redis_streams_integration \
            tests.test_quota_policies \
            tests.test_quota_postgres_integration \
            tests.test_session_data_model \
            tests.test_session_conversation_migration \
            tests.test_session_assets \
            tests.test_issue_20_a_20_02_webhook_security_reliability \
            tests.test_issue_20_c_20_02_signature_expiry_boundaries \
            tests.test_issue_22_a_22_05_graph_storage_benchmark \
            tests.test_platform_perf_smoke -v

  e2e-focused-unit:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-platform.txt -r requirements-knowledge-parsers.txt -r requirements-harness-strands.txt
      - name: Validate page map and route contract
        run: python -m unittest tests.test_issue_753_page_map_contract -v
      - name: Run production API and dedicated worker composition contract
        run: python -m unittest tests.test_issue_614_runtime_composition -v
      - name: Run core business journey, unified model budget and release evidence acceptance tests
        run: python -m unittest tests.test_issue_72_a_72_01_unified_model_budget tests.test_registry_runtime_assembly tests.test_model_runtime_router tests.test_platform_e2e_release_gate tests.test_core_business_journey_e2e tests.test_release_gate_evidence tests.test_release_acceptance_report tests.test_evaluation_variants tests.test_issue_26_a_26_02_metric_accuracy tests.test_issue_28_a_28_02_malicious_skill_blocked -v
      - name: Run connector catalog and backward-compatibility acceptance tests
        run: python -m unittest tests.test_connector_catalog tests.test_connector_framework tests.test_issue_27_a_27_02_connector_isolation -v
      - name: Run distributed evaluation scheduler lease tests
        run: python -m unittest tests.test_evaluation_worker -v
      - name: Run SQLite to PostgreSQL migration parity acceptance
        run: python -m unittest tests.test_issue_666_a_666_06_migration_parity -v

  production-release-evidence:
    needs:
      - changes
      - e2e-security-integration
      - e2e-focused-unit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate complete production evidence (fail-closed)
        env:
          RELEASE_EVIDENCE: ${{ inputs.release_evidence }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("release-evidence.json").write_text(os.environ["RELEASE_EVIDENCE"], encoding="utf-8")
          PY
          python scripts/release_gate.py --evidence release-evidence.json --commit-sha "$GITHUB_SHA"
