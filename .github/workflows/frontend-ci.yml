name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format task UI files
        run: pnpm exec prettier --write src/App.tsx src/features/tasks/task-model.ts src/features/tasks/task-model.test.ts src/features/tasks/TaskCommandCenter.tsx src/styles.css
      - name: Commit formatted files
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/App.tsx frontend/src/features/tasks/task-model.ts frontend/src/features/tasks/task-model.test.ts frontend/src/features/tasks/TaskCommandCenter.tsx frontend/src/styles.css
          git diff --cached --quiet || git commit -m "style(tasks): apply Prettier formatting"
          git push
      - name: Unit tests
        run: pnpm test
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
