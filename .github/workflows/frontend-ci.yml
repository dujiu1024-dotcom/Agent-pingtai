name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply baseline Prettier formatting
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        working-directory: ..
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm --dir frontend exec prettier --write .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          if ! git diff --cached --quiet; then
            git commit -m 'style(frontend): apply Prettier formatting'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
