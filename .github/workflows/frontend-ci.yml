name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Temporary Prettier formatting preview
        run: |
          pnpm exec prettier --write src/lib/api/api-client.ts src/lib/api/api-client.test.ts src/lib/events/event-bus.ts src/lib/events/event-bus.test.ts src/lib/events/query-event-bridge.ts src/lib/events/query-event-bridge.test.ts src/providers/AppProviders.tsx
          git diff -- src/lib/api/api-client.ts src/lib/api/api-client.test.ts src/lib/events/event-bus.ts src/lib/events/event-bus.test.ts src/lib/events/query-event-bridge.ts src/lib/events/query-event-bridge.test.ts src/providers/AppProviders.tsx
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
