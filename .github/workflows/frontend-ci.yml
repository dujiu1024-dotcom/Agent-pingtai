name: frontend-ci

on:
  push:
    branches: [main, feat/ui-g1-743-d-router-navigation]
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Temporary formatter preview
        run: |
          pnpm exec prettier --write src/App.tsx src/components/GlobalSearch.tsx src/components/NotificationsPage.tsx src/components/States.tsx src/components/ErrorBoundary.tsx src/lib/bootstrap/bootstrap.ts src/lib/bootstrap/bootstrap.test.ts src/routes/route-config.ts src/routes/route-config.test.ts src/styles.css README.md package.json
          git diff -- src/App.tsx src/components/GlobalSearch.tsx src/components/NotificationsPage.tsx src/components/States.tsx src/components/ErrorBoundary.tsx src/lib/bootstrap/bootstrap.ts src/lib/bootstrap/bootstrap.test.ts src/routes/route-config.ts src/routes/route-config.test.ts src/styles.css README.md package.json
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
