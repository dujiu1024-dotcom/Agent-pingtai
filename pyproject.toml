[project]
name = "fde-agency"
version = "0.0.0"
description = "FDE OPC Agent 平台（单文件 CLI 底座，纯标准库）"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# 存量文件暂不纳入，先只门禁新增/本轮改动文件
include = [
  "intent.py",
  "conversation.py",
  "tools/schedule_wbs.py",
  "tests/test_console.py",
  "tests/test_listener.py",
  "tests/test_export.py",
  "tests/test_blackboard.py",
  "tests/test_vectors.py",
  "tests/test_memory.py",
  "tests/test_sync.py",
  "tests/test_feishu_config.py",
  "tests/test_conversation.py",
  "agent_platform/**/*.py",
  "tests/test_platform_contracts.py",
  "tests/test_tool_gateway.py",
  "tests/test_outbox.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform", "tests"]

[tool.mypy]
python_version = "3.11"
files = [
  "intent.py",
  "tools/schedule_wbs.py",
  "agent_platform/contracts.py",
  "agent_platform/approval/policy.py",
  "agent_platform/runtime/protocols.py",
  "agent_platform/blackboard/protocol.py",
  "agent_platform/tools/gateway.py",
  "agent_platform/blackboard/postgres_repository.py",
  "agent_platform/approval/postgres.py",
  "agent_platform/events/outbox.py",
  "agent_platform/events/outbox.py",
]
ignore_missing_imports = true
# 只门禁列出的新增文件；被引用模块的存量问题不在这里卡住（见 T-0113）
follow_imports = "silent"
warn_unused_ignores = true
