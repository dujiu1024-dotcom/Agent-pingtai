[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E701/E702：agent_platform 全量代码统一采用单行紧凑写法（`if x: return y`、`a=1;b=2`），
# 无自动修复且改写会触及业务行，按既有风格收敛掉这两条纯格式规则。
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform", "tests"]

[tool.mypy]
python_version = "3.11"
files = [
  "intent.py",
  "tools/schedule_wbs.py",
  "agent_platform/contracts.py",
  "agent_platform/approval/policy.py",
  "agent_platform/runtime/protocols.py",
  "agent_platform/blackboard/protocol.py",
  "agent_platform/tools/gateway.py",
  "agent_platform/observability/*.py",
  "agent_platform/sandbox/oci.py",
  "agent_platform/sandbox/lifecycle.py",
  "agent_platform/tools/gateway_mcp.py",
  "agent_platform/blackboard/postgres_repository.py",
  "agent_platform/approval/postgres.py",
  "agent_platform/security/*.py",
  "agent_platform/events/outbox.py",
  "agent_platform/events/receipts.py",
  "agent_platform/events/consumer.py",
  "agent_platform/runtime/langgraph_adapter.py",
  "agent_platform/runtime/execution.py",
  "agent_platform/runtime/replay.py",
  "agent_platform/observability/run_trace.py",
  "agent_platform/tools/mcp_adapter.py",
  "agent_platform/workflows/multi_expert.py",
  "agent_platform/workflows/blackboard_services.py",
  "agent_platform/workflows/expert_registry.py",
  "agent_platform/models/templates.py",
  "agent_platform/runtime/deepseek_harness.py",
  "agent_platform/runtime/harness_benchmark_suite.py",
  "agent_platform/runtime/harness_baseline_gate.py",
  "agent_platform/runtime/strands_mcp_provider.py",
  "agent_platform/tools/gateway_mcp_http.py",
  "agent_platform/quotas/*.py",
  "agent_platform/identity/*.py",
  "agent_platform/api/contract.py",
  "agent_platform/graph/*.py",
  "agent_platform/memory/review.py",
  "agent_platform/memory/retrieval.py",
  "tests/test_identity.py",
  "agent_platform/streaming/sse.py",
  "agent_platform/streaming/client.py",
  "agent_platform/blackboard/replay.py",
  "agent_platform/blackboard/sse.py",
]
ignore_missing_imports = true
# 只门禁列出的新增文件；被引用模块的存量问题不在这里卡住（见 T-0113）
follow_imports = "silent"
warn_unused_ignores = true
