<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱 · 龍奕 FDE 工作室</title>
<style>
  :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8d96a0;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0}
  header .spacer{flex:1}
  header a{color:var(--accent);text-decoration:none}
  main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px;min-height:calc(100vh - 70px)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .search{display:flex;gap:8px}
  input,button{font:inherit}
  input{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px}
  button{background:#21262d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .muted{color:var(--muted)}
  .status{margin:10px 0 0;font-size:12px;color:var(--muted)}
  ul.list{list-style:none;margin:12px 0 0;padding:0;max-height:60vh;overflow:auto}
  ul.list li{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  ul.list li:hover,ul.list li.active{background:#1f2630;border-color:var(--line)}
  ul.list .type{color:var(--muted);font-size:12px}
  .graph-wrap{position:relative;min-height:520px}
  svg{width:100%;height:calc(100vh - 140px);display:block}
  .legend{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted)}
  .detail{margin-top:12px;font-size:12px;color:var(--muted);word-break:break-all;max-height:160px;overflow:auto}
  .err{color:#f85149}
</style>
</head>
<body>
<header>
  <h1>知识图谱</h1>
  <span class="muted">只读查看 · 平台内置</span>
  <span class="spacer"></span>
  <a href="/app">返回工作台</a>
</header>
<main>
  <section class="panel">
    <div class="search">
      <input id="q" placeholder="输入实体名称或关键词" autocomplete="off">
      <button id="search">搜索</button>
    </div>
    <p class="status" id="status">输入关键词后搜索</p>
    <ul class="list" id="results"></ul>
  </section>
  <section class="panel graph-wrap">
    <svg id="canvas" role="img" aria-label="实体关系图"></svg>
    <div class="legend">点击左侧实体查看一跳邻居 · 点击图中节点继续下钻</div>
    <div class="detail" id="detail"></div>
  </section>
</main>
<script>
"use strict";
const API = "/api/platform/v1/graph";
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
let activeId = null;

// 图谱词表的中文展示名；未知类型回退到原始标识，避免误译后端扩展类型。
const ENTITY_TYPE_LABELS = {
  document: "知识文档",
  memory: "记忆",
  blackboard_entry: "黑板条目",
  user: "用户",
  project: "项目",
};
const RELATION_TYPE_LABELS = {
  references: "引用",
  member_of: "隶属",
};
const entityTypeLabel = (value) => ENTITY_TYPE_LABELS[String(value || "").toLowerCase()] || value || "未知";
const relationTypeLabel = (value) => RELATION_TYPE_LABELS[String(value || "").toLowerCase()] || value || "";
const TYPE_COLORS = {
  document: "#1f6feb",
  memory: "#8957e5",
  blackboard_entry: "#d29922",
  user: "#3fb950",
  project: "#db6d28",
};
const typeColor = (value) => TYPE_COLORS[String(value || "").toLowerCase()] || "#30363d";

async function getJSON(path) {
  const response = await fetch(path, { headers: { Accept: "application/json" }, credentials: "same-origin" });
  if (!response.ok) {
    let message = response.status + " " + response.statusText;
    try { message = (await response.json()).detail || message; } catch (error) { /* 非 JSON 错误体 */ }
    throw new Error(message);
  }
  return response.json();
}

function setStatus(text, error) {
  const node = $("status");
  node.textContent = text;
  node.className = error ? "status err" : "status";
}

function renderResults(items) {
  const list = $("results");
  list.innerHTML = "";
  for (const item of items) {
    const li = document.createElement("li");
    li.dataset.id = item.entity_id;
    if (item.entity_id === activeId) li.className = "active";
    const name = document.createElement("div");
    name.textContent = item.name || item.entity_id;
    const type = document.createElement("div");
    type.className = "type";
    type.textContent = entityTypeLabel(item.entity_type) + (item.project_id ? " · " + item.project_id : " · 租户级");
    li.append(name, type);
    li.addEventListener("click", () => loadNeighbors(item.entity_id));
    list.appendChild(li);
  }
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "没有匹配的实体";
    list.appendChild(li);
  }
}

function svgEl(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
  return node;
}

function labelOf(entity) {
  const attrs = entity.attributes || {};
  return entity.name || attrs.name || entity.entity_id;
}

function draw(center, entities, relations) {
  const svg = $("canvas");
  svg.innerHTML = "";
  const width = svg.clientWidth || 900;
  const height = svg.clientHeight || 520;
  const cx = width / 2, cy = height / 2;
  const nodes = new Map();
  const centerNode = center || (entities.length ? entities[0] : null);
  if (centerNode) nodes.set(centerNode.entity_id, centerNode);
  for (const entity of entities) if (!nodes.has(entity.entity_id)) nodes.set(entity.entity_id, entity);
  const neighbors = [...nodes.values()].filter((entity) => !centerNode || entity.entity_id !== centerNode.entity_id);
  const radius = Math.max(140, Math.min(width, height) / 2 - 70);
  const positions = new Map();
  if (centerNode) positions.set(centerNode.entity_id, { x: cx, y: cy });
  neighbors.forEach((entity, index) => {
    const angle = (2 * Math.PI * index) / Math.max(1, neighbors.length) - Math.PI / 2;
    positions.set(entity.entity_id, { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) });
  });

  for (const relation of relations) {
    const from = positions.get(relation.source_entity_id);
    const to = positions.get(relation.target_entity_id);
    if (!from || !to) continue;
    const line = svgEl("line", { x1: from.x, y1: from.y, x2: to.x, y2: to.y, stroke: "#3d4753", "stroke-width": 1.4 });
    svg.appendChild(line);
    const midX = (from.x + to.x) / 2, midY = (from.y + to.y) / 2;
    const text = svgEl("text", { x: midX, y: midY - 4, fill: "#8d96a0", "font-size": 11, "text-anchor": "middle" });
    text.textContent = relationTypeLabel(relation.relation_type);
    svg.appendChild(text);
  }

  for (const entity of nodes.values()) {
    const point = positions.get(entity.entity_id);
    const isCenter = centerNode && entity.entity_id === centerNode.entity_id;
    const group = svgEl("g", { cursor: "pointer" });
    group.appendChild(svgEl("circle", {
      cx: point.x, cy: point.y, r: isCenter ? 22 : 16,
      fill: isCenter ? "#1f6feb" : typeColor(entity.entity_type),
      stroke: isCenter ? "#58a6ff" : "#3d4753", "stroke-width": 1.5,
    }));
    const name = svgEl("text", {
      x: point.x, y: point.y + (isCenter ? 40 : 34), fill: "#e6edf3",
      "font-size": 12, "text-anchor": "middle",
    });
    const label = labelOf(entity);
    name.textContent = label.length > 14 ? label.slice(0, 14) + "…" : label;
    group.appendChild(name);
    group.addEventListener("click", () => loadNeighbors(entity.entity_id));
    svg.appendChild(group);
  }

  $("detail").textContent = centerNode
    ? "当前实体：" + labelOf(centerNode) + " · 类型：" + entityTypeLabel(centerNode.entity_type) + " · 标识：" + centerNode.entity_id
    : "";
}

async function loadNeighbors(entityId) {
  activeId = entityId;
  setStatus("加载 " + entityId + " 的邻居…");
  try {
    const data = await getJSON(API + "/entities/" + encodeURIComponent(entityId) + "/neighbors?direction=both&depth=1&limit=100");
    const items = $("results").children;
    for (const item of items) item.classList.toggle("active", item.dataset.id === entityId);
    draw(null, data.entities || [], data.relations || []);
    setStatus("实体 " + (data.entities || []).length + " 个 · 关系 " + (data.relations || []).length + " 条" + (data.truncated ? "（已截断）" : ""));
  } catch (error) {
    setStatus("加载失败：" + error.message, true);
  }
}

async function search() {
  const query = $("q").value.trim();
  if (!query) { setStatus("请输入关键词", true); return; }
  setStatus("搜索中…");
  try {
    const data = await getJSON(API + "/entities?q=" + encodeURIComponent(query) + "&limit=50");
    renderResults(data.items || []);
    setStatus("命中 " + (data.items || []).length + " 个实体");
    if ((data.items || []).length) {
      const first = data.items[0];
      await loadNeighbors(first.entity_id);
    } else {
      draw(null, [], []);
    }
  } catch (error) {
    setStatus("搜索失败：" + error.message, true);
  }
}

$("search").addEventListener("click", search);
$("q").addEventListener("keydown", (event) => { if (event.key === "Enter") search(); });
window.addEventListener("resize", () => {
  const items = $("results");
  if (items.children.length) {
    // 仅在已有结果时重排，避免清空初始提示。
    const first = items[0].dataset.id;
    if (first) loadNeighbors(first);
  }
});
setStatus("输入关键词后搜索");
</script>
</body>
</html>
