<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体平台工作台</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111827;color:#dbe3ef;padding:24px 16px}.brand{font-size:18px;font-weight:700;margin:4px 10px 28px}.nav button{display:block;width:100%;border:0;background:transparent;color:#aeb9ca;text-align:left;padding:12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#253246;color:white}.main{padding:28px;max-width:1440px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#68758a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0}.card,.panel{background:white;border:1px solid #e4e9f1;border-radius:12px;padding:18px}.stat{font-size:28px;font-weight:700;margin-top:8px}.panel{margin-top:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d7deea;background:white;padding:9px 13px;border-radius:8px;cursor:pointer}.primary{background:#2457d6;color:white;border-color:#2457d6}input,textarea{border:1px solid #d7deea;border-radius:8px;padding:10px;font:inherit;max-width:100%}textarea{width:100%;min-height:90px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #edf0f5;padding:11px 8px}.hidden{display:none}#message{margin:12px 0;color:#9b341d;white-space:pre-wrap}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:12px}.brand{margin-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">智能体平台</div><nav class="nav" id="nav"><button class="active" data-view="overview">工作台</button><button data-view="agents">Agent 管理</button><button data-view="runs">任务与运行</button><button data-view="approvals">人工审批</button><button data-view="knowledge">知识库</button><button data-view="memory">记忆管理</button><button data-view="blackboard">Blackboard</button><button data-view="models">模型模板</button><button data-view="tools">工具与 Skills</button></nav></aside><main class="main"><header class="top"><div><h1 id="heading">工作台</h1><div class="muted">受监督的智能体执行与协作控制面</div></div><div class="row"><input id="apiBase" value="/api/platform/v1" aria-label="API 地址"><button class="btn" id="refresh">刷新</button></div></header><div id="message" role="status"></div>
<section id="overview"><div class="grid"><div class="card"><div class="muted">Agent 数量</div><div class="stat" id="agentCount">—</div></div><div class="card"><div class="muted">运行中任务</div><div class="stat" id="runCount">—</div></div><div class="card"><div class="muted">待审批</div><div class="stat" id="approvalCount">—</div></div></div><div class="panel"><h2>快速发起任务</h2><div class="row"><input id="agentId" placeholder="Agent ID"><input id="projectId" placeholder="项目 ID（可选）"></div><p><textarea id="taskInput" placeholder="描述需要 Agent 完成的任务"></textarea></p><button class="btn primary" id="submitTask">提交任务</button></div><div class="panel"><h2>最近运行</h2><div id="recentRuns" class="muted">加载中…</div></div></section>
<section id="agents" class="hidden"><div class="panel"><h2>Agent 管理</h2><div class="row"><input id="newAgentId" placeholder="Agent ID"><input id="newAgentName" placeholder="显示名称"><input id="templateRef" placeholder="模型模板 ID（活动版本）"></div><p><textarea id="agentRole" placeholder="Agent 指令（instructions）"></textarea></p><div class="row"><input id="agentToolIds" placeholder="工具 ID，逗号分隔（可选）"><input id="agentSkillIds" placeholder="Skill ID，逗号分隔（可选）"><input id="agentWorkflowId" placeholder="工作流 ID（可选）"></div><button class="btn primary" id="createAgent">创建 Agent</button><div id="agentList"></div></div></section>
<section id="runs" class="hidden"><div class="panel"><h2>任务与运行</h2><div id="runsList"></div><div id="taskDetail" class="panel hidden"></div></div></section><section id="approvals" class="hidden"><div class="panel"><h2>人工审批</h2><div id="approvalList"></div><div id="approvalDetail" class="panel hidden" aria-live="polite"></div></div></section>
<section id="knowledge" class="hidden"><div class="panel"><h2>知识库</h2><div class="row"><input id="docTitle" placeholder="文档标题"><input id="docScope" value="tenant" placeholder="tenant/project/private"></div><textarea id="docText" placeholder="粘贴文本内容"></textarea><button class="btn primary" id="ingestDoc">入库</button><div id="knowledgeList"></div></div></section>
<section id="memory" class="hidden"><div class="panel"><h2>记忆治理</h2><div id="memoryList"></div></div></section><section id="blackboard" class="hidden"><div class="panel"><h2>协作黑板</h2><p class="muted">按任务、运行或项目范围查看专家提案、证据与决策记录。</p><div class="row"><select id="blackboardScope"><option value="task">任务</option><option value="run">运行</option><option value="project">项目</option><option value="tenant">租户</option></select><input id="blackboardScopeId" placeholder="范围 ID"><button class="btn primary" id="loadBlackboard">查询条目</button></div><div id="blackboardList"></div><h3>条目版本历史</h3><div id="blackboardHistory" class="muted">选择条目后查看历史版本。</div></div></section><section id="models" class="hidden"><div class="panel"><h2>模型模板与供应商</h2><div class="row"><input id="newModelId" placeholder="模型模板 ID"><input id="newModelName" placeholder="显示名称"><input id="newModelProvider" placeholder="供应商标识"></div><textarea id="newModelDefinition" placeholder='模型定义 JSON，例如 {"provider":"deepseek-official","model":"...","parameters":{}}'></textarea><button class="btn primary" id="createModel">保存模型模板草稿</button><div id="modelList"></div></div></section><section id="tools" class="hidden"><div class="panel"><h2>工具与 Skills</h2><div class="row"><input id="newToolId" placeholder="工具或 Skill ID"><input id="newToolName" placeholder="名称"></div><textarea id="newToolDefinition" placeholder='定义 JSON，例如 {"description":"...","input_schema":{}}'></textarea><div class="row"><button class="btn primary" id="createTool">保存工具草稿</button><button class="btn" id="createSkill">保存 Skill 草稿</button></div><div id="toolList"></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);let current="overview",capabilities={};
function csrfToken(){const m=document.cookie.match(/(?:^|; )__Host-platform_csrf=([^;]*)/);return m?decodeURIComponent(m[1]):""}
function api(path,opts={}){const method=(opts.method||"GET").toUpperCase(),csrf=csrfToken();return fetch($("apiBase").value.replace(/\/$/,"")+path,{...opts,headers:{"Content-Type":"application/json",...(method!=="GET"&&csrf?{"X-CSRF-Token":csrf}:{}),...(opts.headers||{})}}).then(async r=>{if(!r.ok)throw new Error(String(r.status)+" "+await r.text());return r.status===204?null:r.json()})}
function msg(s){$("message").textContent=s}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function table(rows){if(!rows||!rows.length)return "<p class='muted'>暂无数据</p>";return "<table><tbody>"+rows.map(r=>"<tr>"+r.map(v=>"<td>"+esc(v)+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
function unavailable(feature){return "<p class='muted'>当前服务未挂载："+esc(feature)+"。工作台不会调用未实现的占位 API。</p>"}
async function loadRegistryKinds(kinds,target){
 const sections=[];
 for(const [kind,label] of kinds){
  const result=await api("/registry/"+encodeURIComponent(kind)+"?limit=100");
  const items=result.items||[];
  sections.push("<h3>"+esc(label)+"</h3>");
  if(!items.length){sections.push("<p class='muted'>暂无"+esc(label)+"。</p>");continue}
  sections.push("<table><thead><tr><th>ID</th><th>版本</th><th>状态</th><th>操作</th></tr></thead><tbody>"+items.map(x=>{
   const action=x.status==="draft"?"publish":x.status==="published"?"disable":"";
   const button=action?"<button class='btn' data-registry-action='"+action+"' data-kind='"+esc(kind)+"' data-id='"+esc(x.item_id)+"' data-version='"+esc(x.version)+"'>"+(action==="publish"?"发布":"停用")+"</button>":"";
   return "<tr><td>"+esc(x.item_id)+"</td><td>"+esc(x.version)+"</td><td>"+esc(x.status)+"</td><td>"+button+"</td></tr>";
  }).join("")+"</tbody></table>");
 }
 $(target).innerHTML=sections.join("");
}
function renderTasks(items,target){
 if(!items.length){$(target).innerHTML="<p class='muted'>暂无任务</p>";return}
 $(target).innerHTML="<table><thead><tr><th>任务</th><th>Agent</th><th>状态</th><th>操作</th></tr></thead><tbody>"+items.map(x=>{
  const id=x.task_id||x.run_id;
  const canCancel=["queued","running","paused","interrupted"].includes(x.status);
  return "<tr><td>"+esc(id)+"</td><td>"+esc(x.agent_id)+"</td><td>"+esc(x.status)+(x.status==="queued"&&!x.dispatch_ready?"（准备中）":"")+"</td><td><button class='btn' data-task-action='detail' data-id='"+esc(id)+"'>详情</button> "+(canCancel?"<button class='btn' data-task-action='cancel' data-id='"+esc(id)+"'>取消</button>":"")+"</td></tr>";
 }).join("")+"</tbody></table>";
}
$("runsList").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-task-action]");if(!b)return;
 const id=encodeURIComponent(b.dataset.id),action=b.dataset.taskAction;
 try{
  if(action==="detail"){
   const d=await api("/workbench/tasks/"+id);
   $("taskDetail").classList.remove("hidden");
   $("taskDetail").innerHTML="<h3>任务详情</h3><pre style='white-space:pre-wrap;overflow-wrap:anywhere'>"+esc(JSON.stringify(d,null,2))+"</pre>";
  }else{
   await api("/workbench/tasks/"+id+"/cancel",{method:"POST",body:"{}"});
   msg("取消请求已提交");await load("runs");
  }
 }catch(err){msg("任务操作失败："+err.message)}
});
async function createRegistryDraft(kind,id,definition){
 if(!id.trim())throw new Error("请输入资源 ID");
 await api("/registry/"+encodeURIComponent(kind)+"/"+encodeURIComponent(id.trim())+"/versions",{method:"POST",body:JSON.stringify({definition})});
}
document.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-registry-action]");if(!b)return;
 try{
  const kind=b.dataset.kind,id=encodeURIComponent(b.dataset.id),version=b.dataset.version,action=b.dataset.registryAction;
  if(action==="publish")await api("/registry/"+kind+"/"+id+"/versions/"+version+"/publish",{method:"POST",body:"{}"});
  else if(action==="disable")await api("/registry/"+kind+"/"+id+"/disable",{method:"POST",body:"{}"});
  msg("注册项操作已提交");await load(current);
 }catch(err){msg("注册项操作失败："+err.message)}
});
async function loadCapabilities(){const r=await api("/workbench/capabilities");capabilities=r.features||{}}
function show(view){current=view;document.querySelectorAll("main section").forEach(s=>s.classList.toggle("hidden",s.id!==view));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("heading").textContent=document.querySelector('[data-view="'+view+'"]').textContent;load(view)}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)show(b.dataset.view)});

function renderApprovals(items){
 if(!items.length){$("approvalList").innerHTML="<p class='muted'>暂无待审批动作</p>";return}
 $("approvalList").innerHTML="<table><thead><tr><th>审批编号</th><th>动作</th><th>资源</th><th>状态</th><th>操作</th></tr></thead><tbody>"+items.map(x=>"<tr><td>"+esc(x.approval_id)+"</td><td>"+esc(x.action)+"</td><td>"+esc(x.resource)+"</td><td>"+esc(x.status)+"</td><td><button class='btn' data-approval-action='detail' data-id='"+esc(x.approval_id)+"'>详情</button> <button class='btn primary' data-approval-action='approve' data-id='"+esc(x.approval_id)+"'>批准</button> <button class='btn' data-approval-action='reject' data-id='"+esc(x.approval_id)+"'>拒绝</button> <button class='btn' data-approval-action='revoke' data-id='"+esc(x.approval_id)+"'>撤销</button></td></tr>").join("")+"</tbody></table>";
}
$("approvalList").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-approval-action]");if(!b)return;
 const id=b.dataset.id,action=b.dataset.approvalAction;
 try{
  if(action==="detail"){
   const d=await api("/approvals/"+encodeURIComponent(id));
   $("approvalDetail").classList.remove("hidden");
   $("approvalDetail").innerHTML="<h3>审批详情</h3>"+table([["审批编号",d.approval_id],["运行",d.run_id||"—"],["动作",d.action],["资源",d.resource],["风险级别",d.risk_level],["参数摘要",d.action_hash],["申请人",d.requested_by],["审批人",d.decided_by||"—"],["状态",d.status],["过期时间",d.expires_at]]);
   return;
  }
  if(action==="approve"||action==="reject"){
   await api("/approvals/"+encodeURIComponent(id)+"/decision",{method:"POST",body:JSON.stringify({approved:action==="approve"})});
  }else if(action==="revoke"){
   await api("/approvals/"+encodeURIComponent(id)+"/revoke",{method:"POST",body:"{}"});
  }
  $("approvalDetail").classList.add("hidden");msg("审批操作已提交");await load("approvals");
 }catch(err){msg("审批操作失败："+err.message)}
});

async function load(view=current){msg("");try{
if(!Object.keys(capabilities).length)await loadCapabilities();
if(view==="overview"||view==="agents"){
if(capabilities.agent_management){const a=await api("/registry/agent?limit=100");const items=a.items||[];if(view==="overview")$("agentCount").textContent=items.length;if(view==="agents")await loadRegistryKinds([["agent","Agent"]],"agentList");}
else{$("agentCount").textContent="未接入";$("agentList").innerHTML=unavailable("Agent 管理 API（总控 #2 注册中心依赖）");}}
if(view==="overview"||view==="runs"){
if(capabilities.task_execution){const r=await api("/workbench/tasks?limit=100");const items=r.items||r;if(view==="overview"){$("runCount").textContent=items.filter(x=>["running","queued"].includes(x.status)).length;$("recentRuns").innerHTML=table(items.slice(0,8).map(x=>[x.task_id||x.run_id,x.agent_id,x.status]));}else renderTasks(items,"runsList");}
else{$("runCount").textContent="未接入";$("recentRuns").innerHTML=unavailable("任务与运行 API（总控 #2 任务中心依赖）");$("runsList").innerHTML=unavailable("任务与运行 API");}}
if(view==="overview"||view==="approvals"){
if(capabilities.approvals){const a=await api("/approvals?status=pending");const items=a.items||a;if(view==="overview")$("approvalCount").textContent=items.length;else renderApprovals(items);}
else{$("approvalCount").textContent="未接入";$("approvalList").innerHTML=unavailable("人工审批 API（总控 #2 任务协同依赖）");}}
if(view==="knowledge"){if(capabilities.knowledge)$("knowledgeList").innerHTML=table(((await api("/knowledge/documents")).items||[]).map(x=>[x.title,x.version,x.scope,x.document_id]));else $("knowledgeList").innerHTML=unavailable("知识库 API");}
if(view==="memory"){if(capabilities.memory)$("memoryList").innerHTML=table(((await api("/memories")).items||[]).map(x=>[x.memory_id,x.scope,x.status,x.confidence]));else $("memoryList").innerHTML=unavailable("记忆 API");}
if(view==="blackboard"){if(!capabilities.blackboard)$("blackboardList").innerHTML=unavailable("Blackboard API");else $("blackboardList").innerHTML="<p class='muted'>输入范围 ID 后查询。</p>";}
if(view==="models"){if(capabilities.registry)await loadRegistryKinds([["model_template","模型模板"],["model_provider","模型供应商"]],"modelList");else $("modelList").innerHTML=unavailable("注册中心 API");}
if(view==="tools"){if(capabilities.registry)await loadRegistryKinds([["tool","工具"],["skill","Skill"]],"toolList");else $("toolList").innerHTML=unavailable("注册中心 API");}
}catch(e){msg("API 请求失败："+e.message)}}

$("loadBlackboard").onclick=async()=>{
 if(!capabilities.blackboard){$("blackboardList").innerHTML=unavailable("Blackboard API");return}
 const scope=$("blackboardScope").value,scopeId=$("blackboardScopeId").value.trim();
 if(!scopeId){msg("请输入范围 ID");return}
 try{
  const result=await api("/blackboard/entries?scope="+encodeURIComponent(scope)+"&scope_id="+encodeURIComponent(scopeId));
  const items=result.items||[];
  $("blackboardList").innerHTML=items.length?items.map(item=>"<div class='panel'><div class='row'><strong>"+esc(item.kind)+" · v"+esc(item.version)+"</strong><span class='muted'>"+esc(item.author_id)+"</span><button class='btn' data-entry-history='"+esc(item.entry_id)+"'>版本历史</button></div><pre style='white-space:pre-wrap;overflow-wrap:anywhere'>"+esc(JSON.stringify(item.content,null,2))+"</pre><div class='muted'>证据引用："+esc((item.source_refs||[]).join(", "))+"</div></div>").join(""):"<p class='muted'>该范围暂无条目。</p>";
 }catch(e){msg("Blackboard 查询失败："+e.message)}
};
$("blackboardList").addEventListener("click",async e=>{
 const button=e.target.closest("button[data-entry-history]");if(!button)return;
 try{
  const result=await api("/blackboard/entries/"+encodeURIComponent(button.dataset.entryHistory)+"/history");
  const items=result.items||[];
  $("blackboardHistory").innerHTML=items.length?items.map(item=>"<div class='panel'><strong>版本 "+esc(item.version)+" · "+esc(item.status)+"</strong><pre style='white-space:pre-wrap;overflow-wrap:anywhere'>"+esc(JSON.stringify(item.content,null,2))+"</pre><div class='muted'>"+esc(item.author_id)+" · "+esc(item.created_at)+"</div></div>").join(""):"<p class='muted'>暂无历史。</p>";
 }catch(e){msg("历史读取失败："+e.message)}
});

$("createModel").onclick=async()=>{try{const definition=JSON.parse($("newModelDefinition").value||"{}");definition.name=$("newModelName").value;definition.provider=$("newModelProvider").value;await createRegistryDraft("model_template",$("newModelId").value,definition);msg("模型模板草稿已保存");load("models")}catch(e){msg("模型模板保存失败："+e.message)}};
$("createTool").onclick=async()=>{try{const definition=JSON.parse($("newToolDefinition").value||"{}");definition.name=$("newToolName").value;await createRegistryDraft("tool",$("newToolId").value,definition);msg("工具草稿已保存");load("tools")}catch(e){msg("工具保存失败："+e.message)}};
$("createSkill").onclick=async()=>{try{const definition=JSON.parse($("newToolDefinition").value||"{}");definition.name=$("newToolName").value;await createRegistryDraft("skill",$("newToolId").value,definition);msg("Skill 草稿已保存");load("tools")}catch(e){msg("Skill 保存失败："+e.message)}};
$("refresh").onclick=()=>load();
$("submitTask").onclick=async()=>{if(!capabilities.task_execution){msg("任务执行 API 尚未接入；不会提交到占位接口。");return}try{const r=await api("/workbench/tasks",{method:"POST",body:JSON.stringify({agent_id:$("agentId").value,project_id:$("projectId").value||null,input:{text:$("taskInput").value}})});msg("任务已提交："+r.task_id);show("runs")}catch(e){msg(e.message)}};
$("createAgent").onclick=async()=>{if(!capabilities.agent_management){msg("Agent 管理 API 尚未接入；当前请勿创建占位 Agent。");return}try{const splitIds=id=>$(id).value.split(",").map(x=>x.trim()).filter(Boolean);const definition={name:$("newAgentName").value,instructions:$("agentRole").value,model_template_id:$("templateRef").value.trim(),tool_ids:splitIds("agentToolIds"),skill_ids:splitIds("agentSkillIds")};const workflowId=$("agentWorkflowId").value.trim();if(workflowId)definition.workflow_id=workflowId;if(!definition.instructions.trim()||!definition.model_template_id)throw new Error("请填写 Agent 指令和模型模板 ID");await api("/registry/agent/"+encodeURIComponent($("newAgentId").value.trim())+"/versions",{method:"POST",body:JSON.stringify({definition})});msg("Agent 草稿已创建，请发布后再提交任务");load("agents")}catch(e){msg(e.message)}};
$("ingestDoc").onclick=async()=>{if(!capabilities.knowledge){msg("知识库 API 尚未接入；不会提交到占位接口。");return}try{await api("/knowledge/documents",{method:"POST",body:JSON.stringify({title:$("docTitle").value,scope:$("docScope").value,content:$("docText").value,media_type:"text/plain"})});msg("文档已提交入库");load("knowledge")}catch(e){msg(e.message)}};
load("overview");
</script></body></html>
