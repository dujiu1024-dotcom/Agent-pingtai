let current='/workspace/overview', activeFilter='全部', modalKind='创建';
const allPages=()=>groups.flatMap(g=>g.pages.map(p=>({...p,group:g})));
function buildNav(){document.getElementById('nav').innerHTML=groups.map(g=>'<section class="navgroup expanded" id="g-'+g.id+'"><div class="navhead" onclick="toggleGroup(\''+g.id+'\')"><span class="navicon">'+g.icon+'</span><span class="navtext">'+g.label+'</span><span class="navtext" style="margin-left:auto;color:#a5afbf">⌄</span></div><div class="navchildren">'+g.pages.map(p=>'<div class="subnav" data-path="'+p[1]+'" onclick="go(\''+p[1]+'\')">'+p[0]+'</div>').join('')+'</div></section>').join('')}
function toggleGroup(id){document.getElementById('g-'+id).classList.toggle('expanded')}
function pageFor(path){return allPages().find(p=>p[1]===path)||allPages().find(p=>p[1].split('/').length>3&&path.startsWith(p[1].replace(/\/$/,'')))||allPages()[0]}
function go(path){current=path;activeFilter='全部';render();window.scrollTo(0,0)}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
function statusClass(s){return /失败|离线|拒绝/.test(s)?'bad':/等待|草稿|需评估|索引中/.test(s)?'warn':/运行|在线|兼容|已连接|成功|完成|发布|启用/.test(s)?'':'info'}
function metric(label,value,note,icon){return '<div class="metric"><div class="metriclabel">'+label+'<span class="mi">'+icon+'</span></div><strong>'+value+'</strong><small>'+note+'</small></div>'}
function tableFor(title){let rows=data[title]||[['OBJ-001','示例业务对象','演示数据','运行中','刚刚'],['OBJ-002','第二条记录','演示数据','已完成','5 分钟前'],['OBJ-003','第三条记录','演示数据','待处理','12 分钟前'],['OBJ-004','第四条记录','演示数据','已完成','25 分钟前']];let headers=title==='任务指挥中心'?['任务 ID','任务名称','执行 Agent','状态','优先级','更新时间']:title==='Agent 运行态'?['Agent ID','名称','版本','运行状态','环境']:title==='工具与 MCP'?['工具 ID','名称','类型','连接状态','最近检查']:title==='Workflow 设计'?['Workflow ID','名称','版本','发布状态','运行次数']:['资源 ID','名称','说明 / 规模','状态','更新时间'];return '<div class="panel"><div class="panelhead"><div><h2>'+title+'列表</h2><p>共 '+rows.length+' 条记录 · 演示数据，可进行筛选和详情查看</p></div><span class="tag">LOCAL MOCK</span></div><div class="toolbar"><input class="filter" id="tableSearch" placeholder="搜索名称或 ID…" oninput="filterTable()"><button class="filter '+(activeFilter==='全部'?'active':'')+'" onclick="setFilter(\'全部\')">全部</button><button class="filter '+(activeFilter==='运行中'?'active':'')+'" onclick="setFilter(\'运行中\')">运行中</button><button class="filter '+(activeFilter==='已完成'?'active':'')+'" onclick="setFilter(\'已完成\')">已完成</button><button class="filter '+(activeFilter==='待处理'?'active':'')+'" onclick="setFilter(\'待处理\')">待处理</button></div><div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody id="tableRows">'+rows.map((r,i)=>'<tr data-text="'+r.join(' ').toLowerCase()+'" onclick="showDetail(\''+r[0]+'\',\''+r[1]+'\',\''+r[3]+'\')">'+r.map((c,j)=>'<td>'+(j===(title==='任务指挥中心'?3:title==='Agent 运行态'?3:title==='工具与 MCP'?3:title==='Workflow 设计'?3:3)?'<span class="status '+statusClass(c)+'">'+c+'</span>':c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
function filterTable(){const q=(document.getElementById('tableSearch')?.value||'').toLowerCase();document.querySelectorAll('#tableRows tr').forEach(tr=>{const match=tr.dataset.text.includes(q);const f=activeFilter==='全部'||tr.dataset.text.includes(activeFilter.toLowerCase())||((activeFilter==='已完成')&&tr.dataset.text.includes('成功'));tr.style.display=match&&f?'':'none'})}
function setFilter(f){activeFilter=f;document.querySelectorAll('.toolbar .filter').forEach(b=>b.classList.toggle('active',b.textContent===f));filterTable()}
function showDetail(id,name,status){openModal('记录详情','<div class="cards3"><div class="mini-card"><p>对象 ID</p><b>'+id+'</b></div><div class="mini-card"><p>当前状态</p><span class="status '+statusClass(status)+'">'+status+'</span></div><div class="mini-card"><p>数据来源</p><b>本地演示数据</b></div></div><div class="field"><label>名称</label><input value="'+name+'" readonly></div><div class="field"><label>说明</label><textarea readonly>该对象用于演示列表、详情和操作路径。实际运行数据由生产 API 提供。</textarea></div>')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('show');modalKind=title}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function submitModal(){const fields=[...document.querySelectorAll('#modalBody input,#modalBody textarea,#modalBody select')];const v=fields.map(x=>x.value).filter(Boolean);closeModal();notify(modalKind+'成功（演示环境，未写入生产系统）'+(v[0]?'：'+v[0]:''))}
function createItem(){openModal('创建记录','<div class="field"><label>名称</label><input placeholder="输入名称"></div><div class="field"><label>类型</label><select><option>标准任务</option><option>Agent</option><option>Workflow</option><option>资源</option></select></div><div class="field"><label>描述</label><textarea placeholder="填写用途、目标或配置说明"></textarea></div>')}

if(name.includes('成本')||name.includes('评测'))return '<div class="pagehead"><div><p class="eyebrow">QUALITY / COST CENTER</p><h1>'+name+'</h1><p class="desc">'+desc+'</p></div><div class="actions"><button class="btn" onclick="notify(\'报表已导出（模拟）\')">导出报表</button><button class="btn primary" onclick="createItem()">＋ 新建评测</button></div></div><div class="metrics">'+metric('本月总成本','$2,846.32','较上月下降 8.4%','￥')+metric('Token 消耗','18.6M','输入 12.4M · 输出 6.2M','◈')+metric('平均质量分','94.8','抽样评测得分','✓')+metric('评测运行','128','近 30 天','▤')+'</div><div class="layout"><div class="panel"><div class="panelhead"><h2>模型成本趋势</h2><span class="tag">LAST 30 DAYS</span></div><div class="chart">'+[55,72,65,88,69,92,78].map((v,i)=>'<div class="barwrap"><div class="bar" style="height:'+v+'%"></div><span class="barlabel">'+(i*5+1)+'日</span></div>').join('')+'</div></div><div class="panel"><h2>模型成本占比</h2>'+[['GPT-4.1',62],['Claude Sonnet',24],['Embedding',14]].map(x=>'<p style="font-size:11px;margin:17px 0 6px">'+x[0]+' <b style="float:right">'+x[1]+'%</b></p><div class="progress"><i style="width:'+x[1]+'%"></i></div>').join('')+'</div></div>'+tableFor(name==='评测数据集'?'评测数据集':name==='评测运行'?'评测数据集':'任务指挥中心');
if(name.includes('系统')||name.includes('角色')||name.includes('组织')||name.includes('模型')||name.includes('Prompt')||name==='Agent 定义'||name==='Skills'||name==='工具与 MCP'||name==='审计中心'||name==='调度任务'||name==='事件订阅')return '<div class="pagehead"><div><p class="eyebrow">PLATFORM / ADMINISTRATION</p><h1>'+name+'</h1><p class="desc">'+desc+'</p></div><div class="actions"><button class="btn" onclick="notify(\'配置已刷新\')">↻ 刷新</button><button class="btn primary" onclick="createItem()">＋ 新建</button></div></div><div class="metrics">'+metric('资源总数','24','当前注册资源','▤')+metric('正常运行','21','状态正常','✓')+metric('待处理','2','需要关注','◷')+metric('最近变更','刚刚','配置审计已开启','◉')+'</div><div class="cards3"><div class="mini-card"><b>基础配置</b><p>查看与编辑核心参数、默认策略和运行环境配置。</p><button class="btn" onclick="openModal(\'编辑基础配置\',\'<div class=field><label>配置名称</label><input value=\'default-policy\'></div><div class=field><label>配置值</label><textarea>enabled: true</textarea></div>\')">编辑配置</button></div><div class="mini-card"><b>版本与发布</b><p>查看当前生效版本、历史版本及发布状态。</p><button class="btn" onclick="notify(\'版本历史已加载\')">查看版本</button></div><div class="mini-card"><b>权限与审计</b><p>管理操作权限，查看变更记录与安全事件。</p><button class="btn" onclick="go(\'/admin/audit\')">查看审计</button></div></div>'+tableFor(name==='模型供应商'?'模型供应商':name==='工具与 MCP'?'工具与 MCP':name==='Skills'?'Skills':name==='Workflow 设计'?'Workflow 设计':name==='审计中心'?'审计中心':'Agent 运行态');
return '<div class="pagehead"><div><p class="eyebrow">AGENT PLATFORM / OPERATIONS</p><h1>'+name+'</h1><p class="desc">'+desc+'</p></div><div class="actions"><button class="btn" onclick="notify(\'数据已刷新\')">↻ 刷新</button><button class="btn primary" onclick="createItem()">＋ 新建</button></div></div><div class="metrics">'+metric('总记录','128','当前资源数量','▤')+metric('运行中','18','正在执行','◷')+metric('已完成','106','成功完成','✓')+metric('待处理','4','需要跟进','!')+'</div><div class="layout"><div class="panel"><div class="panelhead"><h2>运行概况</h2><span class="tag">OVERVIEW</span></div><div class="cards3"><div class="mini-card"><b>执行成功</b><h2>98.6%</h2><div class="progress"><i style="width:98.6%"></i></div></div><div class="mini-card"><b>平均耗时</b><h2>2.4s</h2><p>较昨日降低 12%</p></div><div class="mini-card"><b>队列深度</b><h2>06</h2><p>无明显积压</p></div></div></div><div class="panel"><div class="panelhead"><h2>最近事件</h2></div><div class="activity"><div class="activityrow"><i class="activitydot"></i><div>资源状态同步完成<small>系统 · 1 分钟前</small></div></div><div class="activityrow"><i class="activitydot"></i><div>新任务进入执行队列<small>调度器 · 6 分钟前</small></div></div><div class="activityrow"><i class="activitydot"></i><div>配置变更已审计<small>管理员 · 18 分钟前</small></div></div></div></div></div>'+tableFor(name==='Agent 运行态'?'Agent 运行态':'任务指挥中心')}
function render(){const p=pageFor(current),name=p[0],desc=p[2];document.getElementById('crumb').textContent=name;document.querySelectorAll('.subnav').forEach(n=>n.classList.toggle('active',n.dataset.path===current));document.querySelectorAll('.navgroup').forEach(g=>{const active=g.querySelector('.subnav.active');g.classList.toggle('expanded',!!active||g.classList.contains('expanded'))});let body;if(name==='运营驾驶舱')body=dashboard(name,desc);else body=specialPage(name,desc,current);document.getElementById('view').innerHTML=body}
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const p=allPages().find(x=>x[0].toLowerCase().includes(q)||x[2].toLowerCase().includes(q));if(p)go(p[1]);else notify('未找到匹配页面')}});buildNav();go('/workspace/overview');
