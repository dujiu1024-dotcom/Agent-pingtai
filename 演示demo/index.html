<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 平台 · 交互演示</title>
<style>
:root {
  font-family: Inter, Arial, sans-serif;
  color: #17243a;
  background: #f5f7fb;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --brand: #356df3;
  --surface: #ffffff;
  --muted: #728099;
  --border: #e6eaf1;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

.app-shell {
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  width: 248px;
  flex-direction: column;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px 34px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.brand-mark {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 9px;
  background: var(--brand);
  color: white;
  font-weight: 800;
}

.nav-caption,
.status-label,
.eyebrow {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.nav-caption {
  padding: 0 10px 12px;
}

nav {
  display: grid;
  gap: 5px;
}

.nav-item {
  padding: 11px 12px;
  border-radius: 7px;
  color: #526078;
  font-size: 13px;
}

.nav-item.active {
  background: #edf2ff;
  color: var(--brand);
  font-weight: 650;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px 8px;
  color: #9aa4b5;
  font-size: 11px;
}

.main-content {
  max-width: 1440px;
  margin-left: 248px;
  padding: 0 42px 56px;
}

.topbar {
  display: flex;
  height: 70px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

.environment {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
}

.welcome {
  padding: 54px 0 30px;
}

.eyebrow {
  color: var(--brand);
}

h1 {
  margin: 12px 0 8px;
  font-size: clamp(28px, 4vw, 38px);
  letter-spacing: -1.2px;
}

.welcome p:last-child {
  color: var(--muted);
  font-size: 14px;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.status-card {
  display: grid;
  min-height: 144px;
  align-content: center;
  gap: 10px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}

.status-card strong {
  font-size: 21px;
}

.status-note {
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 900px) {
  .sidebar {
    width: 205px;
  }

  .main-content {
    margin-left: 205px;
    padding-right: 24px;
    padding-left: 24px;
  }

  .status-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 620px) {

    position: static;
    width: auto;
    padding-bottom: 10px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    padding-bottom: 16px;
  }

  .nav-caption,
  .sidebar-footer {
    display: none;
  }

  nav {
    display: flex;
    overflow-x: auto;
  }

  .nav-item {
    flex: 0 0 auto;
  }

  .main-content {
    margin-left: 0;

  }

  .topbar {
    height: 56px;
  }

  .welcome {
    padding-top: 34px;
  }
}

.topbar-start {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sidebar-toggle {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: #526078;

  font: inherit;
}

.sidebar-toggle:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.sidebar-collapsed .sidebar {
  width: 72px;
  padding-right: 10px;
  padding-left: 10px;
}

.sidebar-collapsed .brand > span:last-child,
.sidebar-collapsed .nav-caption,
.sidebar-collapsed .nav-item,
.sidebar-collapsed .sidebar-footer {
  display: none;
}

.sidebar-collapsed .brand {
  justify-content: center;
  padding-right: 0;
  padding-left: 0;
}

.sidebar-collapsed .main-content {
  margin-left: 72px;
}

@media (max-width: 620px) {
  .sidebar-collapsed .sidebar {
    width: auto;
    padding-right: 18px;
    padding-left: 18px;
  }

  .sidebar-collapsed .brand > span:last-child,
  .sidebar-collapsed nav,
  .sidebar-collapsed .sidebar-footer {
    display: initial;
  }

  .sidebar-collapsed .brand {
    justify-content: flex-start;
  }

  .sidebar-collapsed .main-content {
    margin-left: 0;
  }
}

/* P0-4 routed application shell */
.app-shell {
  min-height: 100vh;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  width: 248px;
  flex-direction: column;
  padding: 22px 15px 18px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  transition: width 180ms ease;
  z-index: 5;
}
.nav-collapsed .sidebar {
  width: 76px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px 22px;
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
}
.brand-mark {
  display: grid;
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 9px;
  background: var(--brand);
  color: #fff;
  font-weight: 800;
}
.collapse-button {
  align-self: flex-end;
  width: 30px;
  height: 30px;
  margin: -43px 0 18px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: #66748a;
  cursor: pointer;
}
.primary-navigation {
  overflow: auto;
  display: grid;
  gap: 12px;
}
.nav-group {
  display: grid;
  gap: 4px;
  margin: 0;
}
.nav-group-title {
  padding: 0 10px 6px;
  color: #9aa4b5;
  font-size: 11px;
  font-weight: 700;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 39px;
  padding: 9px 11px;
  border-radius: 7px;
  color: #526078;
  font-size: 13px;
  white-space: nowrap;
}
.nav-item.active {
  background: #edf2ff;
  color: var(--brand);
  font-weight: 650;
}
.nav-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border: 1.5px solid #9aa7bb;
  border-radius: 50%;
}
.nav-item.active .nav-dot {
  border-color: var(--brand);
  background: var(--brand);
}
.sidebar-footer {
  display: grid;
  gap: 5px;
  margin-top: auto;
  padding: 14px 8px 0;
  border-top: 1px solid var(--border);

}
.sidebar-footer strong {
  color: #465268;

}
.main-content {
  max-width: 1600px;
  min-height: 100vh;
  margin-left: 248px;
  padding: 0 40px 54px;
  transition: margin-left 180ms ease;
}
.nav-collapsed .main-content {
  margin-left: 76px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  height: 66px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: #f5f7fb;
}
.topbar-start,
.breadcrumbs,
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.breadcrumbs {
  color: var(--muted);
  font-size: 12px;
}
.breadcrumbs span {
  display: flex;
  gap: 10px;
  align-items: center;
}
.breadcrumbs i {
  color: #b2bac7;
  font-style: normal;
}
.top-actions {
  gap: 8px;
}
.top-action {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  color: #526078;
  font-size: 12px;
}
.top-action kbd {
  padding: 2px 5px;
  border: 1px solid #e6eaf1;
  border-radius: 4px;
  color: #8b96a8;
  font-size: 10px;
}
.mode-indicator {
  padding: 6px 9px;
  border-radius: 14px;
  background: #edf2ff;
  color: #2456d8;
  font-size: 11px;
  white-space: nowrap;
}
.page-content {
  padding-bottom: 30px;
}
.page-heading {
  padding: 42px 0 24px;
}
.page-heading h1 {
  margin: 0 0 8px;
  font-size: 30px;
}
.page-heading p:last-child {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.dashboard-hero {
  padding: 42px 28px 30px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: linear-gradient(120deg, #fff 0%, #f4f7ff 100%);
}
.dashboard-hero h1 {
  margin: 10px 0;
  font-size: clamp(28px, 4vw, 38px);
}
.dashboard-hero p:last-child {
  max-width: 680px;
  color: var(--muted);
  font-size: 14px;
}
.shortcut-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin: 20px 0;
}
.shortcut-card {
  position: relative;
  display: grid;
  min-height: 116px;
  align-content: center;
  gap: 9px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
  transition:
    border-color 120ms ease,
    transform 120ms ease;
}
.shortcut-card:hover {
  transform: translateY(-1px);
  border-color: #b9ceff;
}
.shortcut-card strong {
  font-size: 14px;
}
.shortcut-card span:not(.shortcut-arrow) {
  color: var(--muted);
  font-size: 12px;
}
.shortcut-arrow {
  position: absolute;
  top: 18px;
  right: 18px;
  color: var(--brand);
}
.state-panel {
  display: grid;
  min-height: 210px;
  align-content: center;
  justify-items: center;
  gap: 10px;
  padding: 28px;
  border: 1px dashed #dce2ec;
  border-radius: 10px;
  background: #fff;
  text-align: center;
}
.state-panel h2,
.state-panel p {
  margin: 0;
}
.state-panel p {
  max-width: 620px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.state-symbol {
  color: #9aa8bd;
  font-size: 32px;
}
.state-code {
  color: #8b9ab0;
  font-size: 42px;
}
.text-link {
  color: var(--brand);
  font-size: 13px;
}
.button-primary {
  padding: 9px 18px;
  border: 0;
  border-radius: 7px;
  background: var(--brand);
  color: #fff;
  cursor: pointer;
}
.state-panel--error .state-code {
  color: #c43d4b;
}
.spinner {
  width: 22px;
  height: 22px;
  border: 2px solid #dce5fb;
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.bootstrap-screen {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 24px;
}
.bootstrap-screen .state-panel {
  width: min(560px, 100%);
}
.fatal-error {
  max-width: 560px;
  margin: 15vh auto;
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
}
.fatal-error p {
  color: var(--muted);
}
.global-tool-page {
  max-width: 980px;
}
.search-field {
  display: grid;
  gap: 8px;
  max-width: 720px;
  margin: 12px 0 20px;
  color: #465268;
  font-size: 13px;
  font-weight: 600;
}
.search-field input {
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  font: inherit;
  font-weight: 400;
}
.search-results {
  display: grid;
  gap: 0;
  max-width: 720px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  list-style: none;
}
.search-results li + li {
  border-top: 1px solid var(--border);
}
.search-results a {
  display: grid;
  gap: 5px;
  padding: 13px 16px;
}
.search-results a:hover {
  background: #f5f7fb;
}
.search-results small,
.muted {
  color: var(--muted);
  font-size: 12px;
}
a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
@media (max-width: 1023px) {

  .nav-collapsed .sidebar {

    border-bottom: 1px solid var(--border);
  }
  .brand {
    padding-bottom: 12px;
  }
  .collapse-button,
  .sidebar-footer,
  .nav-group-title {
    display: none;
  }
  .primary-navigation {
    display: flex;

  }

  .nav-collapsed .main-content {

  }

  }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Task command center */
.task-center,
.task-detail {
  max-width: 1500px;
}
.task-heading {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-end;
}
.task-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin: 18px 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
}
.task-toolbar input,
.task-toolbar select {
  min-height: 38px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  font: inherit;
  font-size: 12px;
  min-width: 120px;
}
.task-toolbar input:first-child {
  flex: 1;
  min-width: 200px;
}
.task-view-switch {
  display: flex;
  gap: 3px;
  background: #f1f4f9;
  padding: 3px;
  border-radius: 7px;
}
.task-view-switch button,
.button-link {
  border: 0;
  background: transparent;
  padding: 7px 10px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.task-view-switch button.selected {
  background: #fff;
  border-radius: 5px;
  box-shadow: 0 1px 3px #0001;
}
.task-kanban {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  align-items: start;
}
.task-column {
  padding: 12px;
  background: #f4f6fa;
  border: 1px solid #e8edf4;
  border-radius: 9px;
  min-height: 190px;
}
.task-column > header {
  display: flex;
  justify-content: space-between;
  padding: 3px 2px 12px;
  font-size: 13px;
}
.task-card {
  display: grid;
  gap: 8px;
  padding: 12px;
  margin-bottom: 9px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: inherit;
  text-decoration: none;
}
.task-card:hover {
  border-color: #9eb5ed;
}
.task-card small {
  font-size: 11px;
  color: var(--muted);
}
.task-card strong {
  font-size: 13px;
}
.task-card p {
  margin: 0;
  font-size: 12px;
  color: #68758a;
}
.task-blocked {
  color: #a94d36 !important;
  background: #fff2ee;
  padding: 7px;
  border-radius: 5px;
}
.task-table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
}
.task-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  white-space: nowrap;
}
.task-table th,
.task-table td {
  padding: 11px 13px;
  text-align: left;
  border-bottom: 1px solid #edf0f5;
}
.task-table th {
  background: #f7f9fc;
  color: #657187;
}
.task-table td small {
  display: block;
  color: var(--muted);
}
.task-table a,
.task-timeline a {
  color: #315fbd;
  text-decoration: none;
}
.task-timeline article {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 14px;
  padding: 12px;
  border-bottom: 1px solid #edf0f5;
}
.task-timeline time,
.task-timeline span {
  font-size: 11px;
  color: var(--muted);
}
.task-timeline article > div {
  display: grid;
  gap: 5px;
}
.task-detail {
  max-width: 1200px;
}
.task-detail-panel {
  padding: 17px;
  margin: 14px 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 9px;
  min-width: 0;
}
.task-detail-panel h2 {
  font-size: 14px;
  margin: 0 0 13px;
}
.task-detail-panel dl {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 9px;
  margin: 0;
  font-size: 12px;
}
.task-detail-panel dl > div {
  display: contents;
}
.task-detail-panel dt {
  color: var(--muted);
}
.task-detail-panel dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.task-detail-panel pre {
  max-height: 340px;
  overflow: auto;
  padding: 12px;
  background: #f6f8fb;
  border-radius: 7px;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.run-row {
  display: block;
  padding: 11px 3px;
  border-bottom: 1px solid #edf0f5;
  font-size: 12px;
  color: #315fbd;
  text-decoration: none;
}
.run-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  font-size: 12px;
}
.run-summary > div {
  padding: 12px;
  background: #f7f9fc;
  border-radius: 7px;
}
.run-summary a {
  color: #315fbd;
}
.run-timeline {
  padding-left: 22px;
}
.run-timeline li {
  padding: 0 0 16px;
  font-size: 12px;
}
.run-timeline time,
.run-timeline small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}
.run-timeline p {
  margin: 6px 0;
}
.task-data-note {
  color: #778296;
  font-size: 11px;
  line-height: 1.6;
  margin: 16px 0;
}
@media (max-width: 760px) {
  .task-toolbar input,
  .task-toolbar select {
    flex: 1;
    min-width: calc(50% - 8px);
  }
  .task-view-switch {
    width: 100%;
  }
  .task-view-switch button {
    flex: 1;
  }
  .task-detail-panel {
    padding: 12px;
  }
  .run-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .task-timeline article {
    grid-template-columns: 1fr;
    gap: 5px;
  }
}
@media (max-width: 520px) {
  .task-heading {
    align-items: flex-start;
    flex-direction: column;
  }
  .task-kanban {
    grid-template-columns: 1fr;
  }
  .run-summary {
    grid-template-columns: 1fr 1fr;
  }
}


/* Agent collaboration center */
.collaboration-center { max-width: 1500px; }
.collab-section { margin: 24px 0 34px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
.collab-section-heading { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; }
.collab-section-heading h2 { margin:4px 0 0; font-size:21px; }
.collab-agent-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:12px; }
.collab-agent-card { display:grid; grid-template-columns:42px 1fr; gap:8px 12px; padding:16px; border:1px solid var(--border); border-radius:9px; }
.collab-agent-avatar { display:grid; width:42px; height:42px; place-items:center; border-radius:12px; background:#edf2ff; color:var(--brand); font-weight:800; }
.collab-agent-title { display:grid; align-content:center; gap:3px; }
.collab-agent-title span,.collab-agent-card p,.collab-agent-card small { color:var(--muted); font-size:12px; }
.collab-agent-card p,.collab-agent-card dl,.collab-agent-card small { grid-column:1/-1; margin:0; }
.collab-agent-card p { line-height:1.6; }
.collab-agent-card dl,.collab-run-summary dl { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.collab-agent-card dl div,.collab-run-summary dl div { min-width:0; padding:9px; border-radius:7px; background:#f6f8fb; }
.collab-agent-card dt,.collab-run-summary dt { color:var(--muted); font-size:10px; }
.collab-agent-card dd,.collab-run-summary dd { overflow-wrap:anywhere; margin:4px 0 0; font-size:12px; font-weight:650; }
.collab-controls { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0 18px; }
.collab-controls label { display:grid; min-width:220px; gap:6px; color:#526078; font-size:12px; font-weight:600; }
.collab-controls input,.collab-controls select { min-height:39px; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:#fff; font:inherit; font-size:13px; }
.collab-run-layout { display:grid; grid-template-columns:minmax(220px,.8fr) minmax(0,2fr); gap:14px; align-items:start; }
.collab-run-summary,.collab-event-panel,.collab-history { min-width:0; padding:16px; border:1px solid var(--border); border-radius:9px; background:#fbfcfe; }
.collab-run-summary { display:grid; gap:12px; }
.collab-run-summary > strong { font-size:22px; overflow-wrap:anywhere; }
.collab-run-summary dl { grid-template-columns:1fr; }
.collab-event-panel h3,.collab-history h3 { margin:0 0 14px; font-size:15px; }
.collab-event-list,.collab-entry-list,.collab-history ol { margin:0; padding:0; list-style:none; }
.collab-event-list li { position:relative; display:grid; grid-template-columns:12px minmax(0,1fr); gap:10px; padding:0 0 18px; }
.collab-event-dot { width:9px; height:9px; margin-top:5px; border:2px solid var(--brand); border-radius:50%; background:#fff; }
.collab-event-meta { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font-size:12px; }
.collab-event-meta time,.collab-event-list small { color:var(--muted); font-size:11px; }
.collab-event-list p { margin:6px 0; color:#526078; font-size:12px; line-height:1.6; overflow-wrap:anywhere; }
.collab-event-list li > div { padding-bottom:12px; border-bottom:1px solid var(--border); }
.collab-event-panel > .muted { display:block; margin-top:12px; font-size:11px; line-height:1.6; }
.collab-error { color:#b42332; font-size:12px; overflow-wrap:anywhere; }
.collab-blackboard-controls label { min-width:180px; }
.collab-blackboard-layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr); gap:14px; align-items:start; }
.collab-entry-list { display:grid; gap:8px; }
.collab-entry { display:grid; width:100%; gap:6px; padding:13px; border:1px solid var(--border); border-radius:8px; background:#fff; text-align:left; cursor:pointer; }
.collab-entry.selected { border-color:#8eacff; background:#f7f9ff; }
.collab-entry-type { color:var(--brand); font-size:10px; font-weight:750; text-transform:uppercase; }
.collab-entry strong { font-size:13px; }
.collab-entry > span:not(.collab-entry-type) { color:#526078; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
.collab-entry small,.collab-history small,.collab-history span { color:var(--muted); font-size:10px; overflow-wrap:anywhere; }
.collab-history ol { display:grid; gap:12px; }
.collab-history li { display:grid; gap:6px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.collab-history li strong { font-size:12px; }
.collab-history li p { margin:0; color:#526078; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
@media (max-width:900px) { .collab-run-layout,.collab-blackboard-layout { grid-template-columns:1fr; } }
@media (max-width:620px) { .collab-section { padding:13px; } .collab-section-heading { align-items:flex-start; flex-direction:column; } .collab-agent-card dl { grid-template-columns:1fr; } .collab-controls label { min-width:100%; } }

.collab-run-observability {

  gap: 14px;
  min-width: 0;
}

.collab-canvas-placeholder {

/* Round 3 · UI-R3-818 prototype navigation */
:root {
  --r3-primary: #2f6af0;
  --r3-text: #1c2540;
  --r3-muted: #6b7794;
}

html,
body,
#root {
  min-height: 100%;
}

body {
  color: var(--r3-text);
  background: #aebbd8;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC",
    "Microsoft YaHei", sans-serif;
}

.app-shell {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 74% 18%, rgba(255, 255, 255, 0.42), transparent 34%),
    linear-gradient(135deg, #aebbd8 0%, #c4cde0 52%, #aab9d6 100%);
}

.sidebar {
  z-index: 6;
  width: 190px;
  padding: 22px 10px 20px;
  border: 0;
  background: linear-gradient(
    180deg,
    rgba(30, 48, 89, 0.3),
    rgba(30, 48, 89, 0.12)
  );
  box-shadow: 8px 0 28px rgba(46, 65, 111, 0.08);
  backdrop-filter: blur(16px);
  transition: width 0.18s ease;
}

.brand {
  gap: 10px;
  padding: 0 12px;
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0;
}

.brand-mark {
  width: 26px;
  height: 26px;
  flex-basis: 26px;
  border-radius: 0;
  background: linear-gradient(135deg, #6aa4ff, #6d4af0);
  clip-path: polygon(50% 0, 100% 100%, 73% 100%, 50% 48%, 27% 100%, 0 100%);
  color: transparent;
}

.prototype-navigation {
  display: grid;
  gap: 6px;
  margin-top: 54px;
  overflow: visible;
}

.prototype-nav-item {
  display: flex;
  width: 100%;
  height: 49px;
  min-height: 49px;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #cdd7f0;
  font: inherit;
  font-size: 16px;
  text-align: left;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background 0.16s ease,
    box-shadow 0.16s ease,
    color 0.16s ease;
}

.prototype-nav-item i {
  display: inline-grid;
  width: 20px;
  flex: 0 0 20px;
  place-items: center;
  font-size: 17px;
  font-style: normal;
  opacity: 0.92;
}

.prototype-nav-item:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.prototype-nav-item.on,
.prototype-nav-item[aria-current="page"] {
  background: linear-gradient(90deg, #3d7bff, #2f6af0);
  color: #fff;
  box-shadow: 0 6px 16px rgba(47, 106, 240, 0.45);
}

.main-content {
  max-width: none;
  min-height: 100vh;
  margin-left: 190px;
  padding: 0 26px 54px;
  transition: margin-left 0.18s ease;
}

.nav-collapsed .sidebar {
  width: 68px;
  padding-right: 8px;
  padding-left: 8px;
}

.nav-collapsed .brand {
  justify-content: center;
  padding: 0;
}

.nav-collapsed .prototype-navigation {
  margin-top: 54px;
}

.nav-collapsed .prototype-nav-item {
  justify-content: center;
  padding: 0;
}

.nav-collapsed .main-content {
  margin-left: 68px;
}

.topbar {
  position: relative;
  z-index: 5;
  height: 84px;
  justify-content: space-between;
  border: 0;
  background: transparent;
  color: var(--r3-muted);
}

.top-search {
  display: flex;
  width: min(369px, 48vw);
  height: 41px;
  align-items: center;
  gap: 10px;
  margin-left: 20px;
  padding: 0 16px;
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: 21px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow:
    0 12px 26px -12px rgba(50, 80, 170, 0.26),
    0 2px 6px rgba(50, 80, 170, 0.07);
  backdrop-filter: blur(16px);
}

.top-search-icon {
  color: #7b86a3;
  font-size: 22px;
  line-height: 1;
}

.top-search input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--r3-text);
  font: inherit;
  font-size: 14px;
}

.top-search input::placeholder {
  color: #7b86a3;
  opacity: 1;
}

.top-search kbd {
  flex: 0 0 auto;
  color: #7b86a3;
  font: inherit;
  font-size: 12px;
  white-space: nowrap;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.top-icon-button,
.user-avatar {
  position: relative;
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 10px 22px -12px rgba(50, 80, 170, 0.3);
  color: var(--r3-text);
  font-size: 18px;
  cursor: pointer;
}

.notification-button i {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
}

.user-avatar {
  width: 42px;
  height: 42px;
  flex-basis: 42px;
  border: 2px solid rgba(255, 255, 255, 0.95);
  background: linear-gradient(145deg, #6d8fe8, #334e91);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
}

.prototype-toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 8px);
  padding: 8px 16px;
  border-radius: 20px;
  background: #1b2540;
  color: #fff;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.prototype-toast.visible {
  transform: translate(-50%, 0);
  opacity: 1;
}

@media (max-width: 900px) {
  .sidebar {
    width: 170px;
  }

  .main-content {
    margin-left: 170px;
    padding-right: 18px;
    padding-left: 18px;
  }

  .nav-collapsed .sidebar {
    width: 64px;
  }

  .nav-collapsed .main-content {
    margin-left: 64px;
  }

  .top-search {
    margin-left: 0;
  }
}

@media (max-width: 640px) {
  .sidebar,
  .nav-collapsed .sidebar {
    position: sticky;
    top: 0;
    width: 100%;
    height: auto;
    padding: 10px 12px;
    background: rgba(30, 48, 89, 0.88);
  }

  .brand {
    padding: 0 4px;
    font-size: 17px;
  }

  .prototype-navigation,
  .nav-collapsed .prototype-navigation {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    overflow-x: auto;
  }

  .prototype-nav-item,
  .nav-collapsed .prototype-nav-item {
    width: auto;
    min-width: 42px;
    height: 40px;
    min-height: 40px;
    padding: 0 10px;
    font-size: 13px;
  }

  .prototype-nav-item i {
    width: auto;
    flex-basis: auto;
  }

  .nav-collapsed .brand {
    justify-content: flex-start;
  }

  .main-content,
  .nav-collapsed .main-content {
    margin-left: 0;
    padding: 0 14px 30px;
  }

  .topbar {
    height: 68px;
  }

  .top-search {
    width: 100%;
  }

  .top-search kbd {
    display: none;
  }

  .top-actions {
    gap: 7px;
  }

  .top-icon-button {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    flex-basis: 36px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .prototype-nav-item,
  .prototype-toast {
    transition: none;
  }
}

@media(max-width:1100px){.demo-grid-2{grid-template-columns:1fr}.office-scene{width:90%;height:350px}}
@media(max-width:820px){.demo-grid-3{grid-template-columns:1fr}.office-main-grid{grid-template-columns:1fr}.office-canvas{min-height:450px}.demo-table-wrap{overflow-x:auto}}
@media(max-width:640px){.main-content{padding:0 14px 32px}.demo-grid-3{grid-template-columns:1fr}.page-head-row{align-items:flex-start;flex-direction:column}.office-scene{width:95%;height:300px}.office-canvas{min-height:360px}}
</style></head>
<body>
<div class="app-shell" id="appShell">
<aside class="sidebar" aria-label="主导航">
<a class="brand" href="#/workspace/overview"><span class="brand-mark">A</span><span>Agent 平台</span></a>
<nav class="prototype-navigation" aria-label="全局导航">
<a class="prototype-nav-item on" data-route="/workspace/overview" href="#/workspace/overview"><i>⌂</i><span>工作台</span></a>
<a class="prototype-nav-item" data-route="/workspace/office" href="#/workspace/office"><i>▣</i><span>3D 办公室</span></a>
<a class="prototype-nav-item" data-route="/workspace/tasks" href="#/workspace/tasks"><i>☰</i><span>任务中心</span></a>
<a class="prototype-nav-item" data-route="/workspace/collaboration" href="#/workspace/collaboration"><i>⚇</i><span>Agent 协作</span></a>
<a class="prototype-nav-item" data-route="/admin/workflows" href="#/admin/workflows"><i>⌘</i><span>Workflow</span></a>
<a class="prototype-nav-item" data-route="/workspace/quality-cost" href="#/workspace/quality-cost"><i>¥</i><span>成本分摊</span></a>
<a class="prototype-nav-item" data-route="/admin/settings" href="#/admin/settings"><i>⚙</i><span>系统管理</span></a>
<button class="prototype-nav-item collapse-nav-item" id="collapseBtn"><i>«</i><span>收起侧边栏</span></button>
</nav><div class="sidebar-footer"><strong>Agent Platform</strong><span>交互演示 · 本地样例数据</span></div>
</aside>
<main class="main-content">
<header class="topbar"><form class="top-search" id="searchForm"><span class="top-search-icon">⌕</span><input id="globalSearch" placeholder="搜索 Agent、任务、文档…" aria-label="搜索 Agent、任务、文档"><kbd>Ctrl + K</kbd></form><div class="top-actions"><button class="top-icon-button notification-button" title="通知">♧<i></i></button><button class="top-icon-button" id="themeBtn" title="主题">☼</button><button class="user-avatar" id="userBtn" title="用户账户">A</button></div></header>
<div id="pageRoot"></div>
</main></div>
<div class="prototype-toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="taskModal"><section class="demo-modal"><h2>创建任务</h2><form class="demo-form" id="createTaskForm"><div class="demo-field"><label>任务名称</label><input id="taskTitle" required placeholder="例如：整理本周客户反馈"></div><div class="demo-field"><label>选择 Agent</label><select id="taskAgent"><option>Research Agent</option><option>Data Analyst</option><option>Workflow Assistant</option><option>Knowledge Curator</option></select></div><div class="demo-field"><label>任务说明</label><textarea id="taskDesc" rows="3" placeholder="输入任务目标与要求"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="demo-btn" type="button" id="cancelCreate">取消</button><button class="demo-btn primary">创建演示任务</button></div></form></section></div>
<script>
const sampleTasks=[
{id:"tsk_01J8A2",title:"汇总本周客户反馈并生成洞察",agent:"Research Agent",status:"running",priority:"高",updated:"刚刚"},
{id:"tsk_01J89F",title:"分析 Q4 产品使用数据",agent:"Data Analyst",status:"waiting_approval",priority:"普通",updated:"5 分钟前"},
{id:"tsk_01J87C",title:"同步知识库新增产品文档",agent:"Knowledge Curator",status:"succeeded",priority:"普通",updated:"18 分钟前"},
{id:"tsk_01J85B",title:"生成竞品分析报告初稿",agent:"Research Agent",status:"queued",priority:"高",updated:"32 分钟前"},
{id:"tsk_01J82D",title:"检查工作流运行异常",agent:"Workflow Assistant",status:"failed",priority:"紧急",updated:"1 小时前"}
];
const agents=[{name:"Research Agent",desc:"市场研究 · 信息检索与报告生成",status:"运行中",initial:"R"},{name:"Data Analyst",desc:"数据分析 · 指标计算与洞察",status:"空闲",initial:"D"},{name:"Workflow Assistant",desc:"流程编排 · 自动化执行",status:"协作中",initial:"W"},{name:"Knowledge Curator",desc:"知识管理 · 文档解析与索引",status:"空闲",initial:"K"}];
const zones=[["专注工位","FOCUS PODS"],["团队工作室","TEAM STUDIO"],["协作会议区","MEETING HUB"],["知识中心","KNOWLEDGE"],["运营中枢","OPS CENTER"]];
let route=location.hash.slice(1)||"/workspace/overview",taskFilter="all",collabTab="team",floor=2,topView=false,selectedDesk="",toastTimer;
const $=s=>document.querySelector(s);
function notify(s){const t=$("#toast");t.textContent=s;t.classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("visible"),1800)}
function status(s){return s==="running"?"<span class='pill run'>运行中</span>":s==="waiting_approval"?"<span class='pill wait'>等待审批</span>":s==="failed"?"<span class='pill fail'>失败</span>":s==="succeeded"?"<span class='pill'>已完成</span>":"<span class='pill blue'>排队中</span>"}
function dashboard(){const done=sampleTasks.filter(t=>t.status==="succeeded").length,run=sampleTasks.filter(t=>t.status==="running").length,waiting=sampleTasks.filter(t=>t.status==="waiting_approval").length;return `<section class="page-content workspace-dashboard">
<div class="workspace-welcome"><div><p class="workspace-eyebrow">AGENT PLATFORM / WORKSPACE</p><h1>工作台 <span class="demo-flag">演示数据</span></h1><p>统一查看任务执行、Agent 协作与平台运营动态</p></div><button class="workspace-primary-action" onclick="openCreate()">创建 / 管理任务 <span>↗</span></button></div>
<div class="demo-note">当前为本地交互演示，以下任务与 Agent 均为样例数据；生产页面从 Workbench API 和 Agent Registry 读取真实数据。</div>
<div class="workspace-metrics"><article class="workspace-metric"><div class="workspace-metric-top"><span>任务总数</span><i class="metric-blue">▤</i></div><strong>${sampleTasks.length}</strong><small>当前演示数据集</small></article><article class="workspace-metric"><div class="workspace-metric-top"><span>成功率</span><i class="metric-green">✓</i></div><strong>20%</strong><small>${done} 项已完成</small></article><article class="workspace-metric"><div class="workspace-metric-top"><span>平均耗时</span><i class="metric-purple">◷</i></div><strong>2.4 分钟</strong><small>样例任务耗时</small></article><article class="workspace-metric"><div class="workspace-metric-top"><span>总成本</span><i class="metric-orange">￥</i></div><strong>—</strong><small>成本 API 尚未接入此工作台</small></article></div>
<div class="workspace-primary-grid"><article class="workspace-panel workspace-trend-panel"><div class="workspace-panel-heading"><div><h2>任务趋势</h2><p>近 7 天 · 按任务创建时间统计</p></div><span class="workspace-panel-tag">DEMO DATA</span></div><div class="workspace-trend-summary"><strong>5</strong><span>当前返回任务</span><div><b>${run}</b> 运行中 <i></i> <b>${done}</b> 已完成</div></div><div class="workspace-chart">${[1,2,2,3,2,4,5].map((n,i)=>`<div class="workspace-chart-column"><span>${n}</span><i style="height:${n*17}%"></i><small>${["周一","周二","周三","周四","周五","周六","周日"][i]}</small></div>`).join("")}</div></article>
<article class="workspace-panel workspace-agent-panel"><div class="workspace-panel-heading"><div><h2>热门 Agent</h2><p>来自 Agent Registry</p></div><a href="#/workspace/collaboration">查看全部 ↗</a></div><div class="workspace-agent-list">${agents.map((a,i)=>`<div class="workspace-agent-item"><span class="workspace-agent-avatar agent-avatar-${i}">${a.initial}</span><span><strong>${a.name}</strong><small>${a.desc}</small></span><i>›</i></div>`).join("")}</div></article></div>
<div class="workspace-secondary-grid"><article class="workspace-panel workspace-task-panel"><div class="workspace-panel-heading"><div><h2>任务列表</h2><p>从任务中心同步最新执行记录</p></div><a href="#/workspace/tasks">进入任务中心 ↗</a></div><div class="workspace-tabs"><button class="${taskFilter==="all"?"active":""}" onclick="setTaskFilter('all')">全部任务 <span>5</span></button><button class="${taskFilter==="running"?"active":""}" onclick="setTaskFilter('running')">运行中 <span>1</span></button><button class="${taskFilter==="approval"?"active":""}" onclick="setTaskFilter('approval')">等待审批 <span>1</span></button></div><div class="workspace-task-list">${taskRows(taskFilter)}</div></article>
<article class="workspace-panel workspace-activity-panel"><div class="workspace-panel-heading"><div><h2>最近动态</h2><p>按任务更新时间排序</p></div><span class="workspace-panel-tag">ACTIVITY</span></div><div class="workspace-activity-list">${sampleTasks.slice(0,4).map(t=>`<div class="workspace-activity-item"><i class="${t.status==="running"?"is-running":t.status==="failed"?"is-failed":"is-pending"}"></i><span><strong>${t.title}</strong><small>${statusText(t.status)} · ${t.updated}</small></span></div>`).join("")}</div></article></div>
<div class="workspace-entry-row"><a href="#/workspace/collaboration"><span>⌘</span><strong>Agent 协作</strong><small>Agent 与协作运行态</small><i>↗</i></a><a href="#/admin/workflows"><span>⌁</span><strong>Workflow</strong><small>工作流设计与编排</small><i>↗</i></a><a href="#/workspace/quality-cost"><span>￥</span><strong>成本分摊</strong><small>用量、成本与质量</small><i>↗</i></a><a href="#/workspace/tasks"><span>▤</span><strong>运行任务</strong><small>任务队列与执行状态</small><i>↗</i></a></div></section>`}
function statusText(s){return ({running:"运行中",waiting_approval:"等待审批",succeeded:"已完成",queued:"排队中",failed:"失败"})[s]||s}
function taskRows(f){return sampleTasks.filter(t=>f==="all"||f==="running"&&t.status==="running"||f==="approval"&&t.status==="waiting_approval").map(t=>`<a href="#/workspace/tasks" class="workspace-task-row"><span class="workspace-task-symbol">▣</span><span class="workspace-task-copy"><strong>${t.title}</strong><small>${t.id} · ${t.updated}</small></span>${status(t.status)}<i>›</i></a>`).join("")||'<div class="workspace-inline-empty">此分类暂无任务记录</div>'}
function office(){const floorData=[["03","创新与协作层","会议、协作与项目空间"],["02","智能体工作层","Agent 工位与部门区域"],["01","运营与知识层","知识中心与运维空间"]][3-floor];return `<section class="office-workspace"><div class="office-topbar"><div class="office-brand"><span class="office-brand-mark">A</span><span><strong>AGENT OFFICE</strong><small>智能体数字办公空间</small></span></div><div class="office-floor-tabs">${[3,2,1].map(n=>`<button class="office-floor-tab ${floor===n?"active":""}" onclick="setFloor(${n})"><strong>0${n}</strong><span>${["创新与协作层","智能体工作层","运营与知识层"][3-n]}</span></button>`).join("")}</div><div class="office-top-actions"><span class="office-sync-state"><i></i>演示场景 · 实时数据待接入</span><button class="office-view-button ${!topView?"active":""}" onclick="setView(false)">空间视角</button><button class="office-view-button ${topView?"active":""}" onclick="setView(true)">俯视图</button></div></div>
<div class="office-heading"><div><p class="office-eyebrow">DIGITAL WORKSPACE / 0${floor}F</p><h1>${floorData[1]}</h1><p>${floorData[2]} <span>·</span> 交互式空间模型</p></div><div class="office-heading-stats"><div><strong>21</strong><span>工位总数</span></div><i></i><div><strong>00</strong><span>在线 Agent</span></div><i></i><div><strong>—</strong><span>执行中任务</span></div></div></div>
<div class="office-main-grid"><div class="office-viewport"><div class="office-viewport-caption"><span><i></i>3D SPACE</span><span>拖拽旋转 · 点击工位查看 · 俯视图切换</span></div><div class="office-canvas"><div class="office-scene ${topView?"top":""}"><div class="office-room"></div>${zones.map((z,i)=>`<div class="office-zone z${i+1}"><label>${z[1]}</label></div>`).join("")}${Array.from({length:21},(_,i)=>{const col=i%7,row=Math.floor(i/7);return `<button aria-label="选择工位 D-${String(i+1).padStart(2,"0")}" class="office-desk ${selectedDesk===i+1?"selected":""}" style="left:${13+col*11.1}%;top:${18+row*29}%" onclick="selectDesk(${i+1})"></button>`}).join("")}</div></div><div class="office-map-legend"><span><i class="legend-desk"></i>标准工位</span><span><i class="legend-selected"></i>已选工位</span><span><i class="legend-agent"></i>Agent 状态（待接入）</span><small>场景布局为交互式空间模型，Agent 状态以服务端快照为准</small></div></div>
<aside class="office-inspector"><div class="office-inspector-title"><div><p class="office-eyebrow">SPACE EXPLORER</p><h2>空间信息</h2></div><span class="office-floor-chip">0${floor}F</span></div><label class="office-search"><span>⌕</span><input id="officeSearch" placeholder="搜索 Agent / 工位" oninput="filterDesks(this.value)"></label><div class="office-inspector-section"><div class="office-section-heading">楼层概览 <span>OVERVIEW</span></div><div class="office-floor-overview"><div><strong>21</strong><span>工位</span></div><div><strong>05</strong><span>功能区域</span></div><div><strong>00</strong><span>Agent</span></div></div></div><div class="office-inspector-section"><div class="office-section-heading">功能区域 <span>5 ZONES</span></div><div class="office-zone-list">${zones.map(z=>`<div class="office-zone-row"><span class="office-zone-dot"></span><span><strong>${z[0]}</strong><small>${z[1]}</small></span><span class="office-zone-count">—</span></div>`).join("")}</div></div><div class="office-inspector-section office-agent-section"><div class="office-section-heading">Agent 状态 <span>0 ONLINE</span></div><div class="office-no-agents"><span>⌁</span><strong>暂无实时 Agent 数据</strong><p>Office snapshot 接入后，将在此展示 Agent、当前任务与实时状态。</p></div></div><div class="office-selected-desk"><span>工位详情</span><strong>${selectedDesk?"D-"+String(selectedDesk).padStart(2,"0"):"选择一个工位"}</strong><small>${selectedDesk?"尚未分配 Agent":"点击 3D 场景中的桌面查看详情"}</small></div><p class="office-api-note">状态数据：服务端 Office snapshot / event stream。未接入前不展示模拟运行状态。</p></aside></div></section>`}
function tasksPage(){return `<section class="page-content"><div class="page-head-row"><div><p class="workspace-eyebrow">WORKSPACE / TASKS</p><h1>任务指挥中心 <span class="demo-flag">演示数据</span></h1><p>任务队列、执行状态与人工干预入口</p></div><button class="demo-btn primary" onclick="openCreate()">＋ 创建任务</button></div><div class="demo-note">本地模拟任务列表。生产页面通过 /platform/v1/workbench/tasks 和 /platform/v1/runs 查询数据。</div><div class="demo-toolbar"><input id="taskSearch" placeholder="搜索任务名称或 ID" oninput="renderTaskTable()"><select id="taskStatus" onchange="renderTaskTable()"><option value="all">全部状态</option><option value="running">运行中</option><option value="waiting_approval">等待审批</option><option value="queued">排队中</option><option value="succeeded">已完成</option><option value="failed">失败</option></select><button class="demo-btn" onclick="renderTaskTable()">刷新</button></div><div class="demo-panel demo-table-wrap"><table class="demo-table"><thead><tr><th>任务</th><th>任务 ID</th><th>Agent</th><th>优先级</th><th>状态</th><th>更新时间</th></tr></thead><tbody id="taskTableBody"></tbody></table></div></section>`}
function renderTaskTable(){const q=($("#taskSearch")?.value||"").toLowerCase(),f=$("#taskStatus")?.value||"all";const rows=sampleTasks.filter(t=>(f==="all"||t.status===f)&&(t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)));$("#taskTableBody").innerHTML=rows.map(t=>`<tr><td><strong>${t.title}</strong></td><td>${t.id}</td><td>${t.agent}</td><td>${t.priority}</td><td>${status(t.status)}</td><td>${t.updated}</td></tr>`).join("")||'<tr><td colspan="6">没有匹配的任务</td></tr>'}
function collaboration(){return `<section class="page-content"><div class="page-head-row"><div><p class="workspace-eyebrow">AGENT OPERATIONS / COLLABORATION</p><h1>智能体协作中心 <span class="demo-flag">演示数据</span></h1><p>Agent 团队、运行执行时间线与协作黑板</p></div></div><div class="demo-note">生产模块从 Agent Registry、Runs、Run Events 与 Blackboard API 读取；此处使用本地示例数据展示交互结构。</div><div class="demo-tabs"><button class="${collabTab==="team"?"active":""}" onclick="setCollab('team')">智能体团队</button><button class="${collabTab==="runs"?"active":""}" onclick="setCollab('runs')">运行执行时间线</button><button class="${collabTab==="board"?"active":""}" onclick="setCollab('board')">协作黑板</button></div>${collabTab==="team"?`<div class="demo-grid-3">${agents.map(a=>`<article class="demo-panel"><div class="demo-list-item"><div class="demo-avatar">${a.initial}</div><div><strong>${a.name}</strong><small>${a.desc}</small></div><span class="pill run">${a.status}</span></div><p style="font-size:10px;color:#8996ab;line-height:1.7">Agent Registry 条目 · 版本 v1.3 · 运行信息以服务端为准</p></article>`).join("")}</div>`:collabTab==="runs"?`<div class="demo-grid-2"><article class="demo-panel"><h3>最近运行</h3><div class="demo-list">${sampleTasks.slice(0,4).map((t,i)=>`<div class="demo-list-item"><div class="demo-avatar">R${i+1}</div><div><strong>${t.title}</strong><small>${t.id} · ${t.updated}</small></div>${status(t.status)}</div>`).join("")}</div></article><article class="demo-panel"><h3>执行事件时间线</h3><div class="demo-list">${["run.created · 运行已创建","agent.started · Agent 开始执行","tool.called · 调用知识检索工具","run.waiting_approval · 等待人工审批"].map((x,i)=>`<div class="demo-list-item"><span class="pill blue">0${i+1}</span><div><strong>${x}</strong><small>事件顺序来自示例，不代表真实运行轨迹</small></div></div>`).join("")}</div></article></div>`:`<div class="demo-panel"><div class="page-head-row" style="padding:0 0 10px"><div><h2>协作黑板</h2><p>共享上下文、决策与任务状态</p></div><button class="demo-btn primary" onclick="notify('示例条目已在本地添加')">＋ 新建条目</button></div><div class="demo-grid-3">${[["进行中","客户反馈分析","Research Agent"],["待决策","Q4 指标口径确认","Data Analyst"],["已完成","知识库更新摘要","Knowledge Curator"]].map((x,i)=>`<article class="demo-stat"><span>${x[0]}</span><strong style="font-size:15px">${x[1]}</strong><small style="color:#9aa5b8">${x[2]}</small></article>`).join("")}</div></div>`}</section>`}
function workflow(){return `<section class="page-content"><div class="page-head-row"><div><p class="workspace-eyebrow">REGISTRY / WORKFLOW</p><h1>Workflow 设计 <span class="demo-flag">演示数据</span></h1><p>工作流定义、可视化编排与版本发布</p></div><button class="demo-btn primary" onclick="addNode()">＋ 添加节点</button></div><div class="demo-note">结构参照生产 Workflow Designer；保存、编译与发布在此为本地演示操作，不调用生产 API。</div><div class="demo-panel" style="margin-bottom:14px"><div class="demo-toolbar"><strong>客户反馈分析流程</strong><span class="pill blue">草稿 v3</span><span style="flex:1"></span><button class="demo-btn" onclick="notify('草稿已在本地保存')">保存草稿</button><button class="demo-btn primary" onclick="notify('演示编译通过：3 节点 / 2 条连线')">编译检查</button><button class="demo-btn" onclick="notify('演示发布已完成（仅本地）')">发布</button></div><div class="workflow-canvas" id="workflowCanvas"><div class="workflow-node start"><b>开始</b><small>触发输入</small></div><span class="workflow-arrow">→</span><div class="workflow-node"><b>Research Agent</b><small>检索客户反馈</small></div><span class="workflow-arrow">→</span><div class="workflow-node"><b>Data Analyst</b><small>归纳主题与趋势</small></div><span class="workflow-arrow">→</span><div class="workflow-node end"><b>输出报告</b><small>生成结构化摘要</small></div></div></div><div class="demo-grid-3"><div class="demo-stat"><span>节点数量</span><strong id="nodeCount">4</strong></div><div class="demo-stat"><span>连线数量</span><strong id="edgeCount">3</strong></div><div class="demo-stat"><span>最近发布</span><strong style="font-size:16px">—</strong></div></div></section>`}
function cost(){return `<section class="page-content"><div class="page-head-row"><div><p class="workspace-eyebrow">ANALYTICS / COST & QUALITY</p><h1>成本与质量中心 <span class="demo-flag">演示数据</span></h1><p>模型用量、成本归集与评测质量分析</p></div></div><div class="demo-note">真实成本指标需要成本 API 返回；下方仅展示成本与质量中心的信息结构，未接入的指标保留为 —。</div><div class="demo-grid-3"><div class="demo-stat"><span>总成本</span><strong>—</strong><small>成本聚合 API 待接入</small></div><div class="demo-stat"><span>Token 用量</span><strong>—</strong><small>用量聚合 API 待接入</small></div><div class="demo-stat"><span>评测成功率</span><strong>—</strong><small>评测数据集与运行统计</small></div></div><div class="demo-grid-2" style="margin-top:14px"><article class="demo-panel"><h3>成本分析</h3><div class="workspace-inline-empty">暂无已接入的成本聚合数据</div></article><article class="demo-panel"><h3>质量评测</h3><div class="workspace-inline-empty">请选择评测数据集或评测运行查看结果</div></article></div></section>`}
function settings(){return `<section class="page-content"><div class="page-head-row"><div><p class="workspace-eyebrow">PLATFORM / ADMINISTRATION</p><h1>系统管理</h1><p>服务端启动配置、平台版本与系统能力</p></div></div><div class="demo-note">生产系统设置页读取 Bootstrap 与管理 API。此演示不暴露生产配置、不写入服务端设置。</div><div class="demo-panel"><h3>平台信息</h3><table class="demo-table"><tbody><tr><td>产品名称</td><td>Agent 平台</td></tr><tr><td>运行模式</td><td>本地演示模式</td></tr><tr><td>前端来源</td><td>frontend/src · React Router</td></tr><tr><td>身份认证</td><td>未连接生产服务</td></tr><tr><td>服务端版本</td><td>—</td></tr><tr><td>Capabilities</td><td>由服务端 Bootstrap 决定</td></tr></tbody></table></div></section>`}
function openCreate(){$("#taskModal").classList.add("open");$("#taskTitle").focus()}
function closeCreate(){$("#taskModal").classList.remove("open")}
function setTaskFilter(f){taskFilter=f;render()}
function setCollab(t){collabTab=t;render()}
function setFloor(n){floor=n;selectedDesk="";render()}
function setView(v){topView=v;render()}
function selectDesk(n){selectedDesk=n;render()}
function filterDesks(q){document.querySelectorAll(".office-desk").forEach((d,i)=>d.style.opacity=!q||("d-"+String(i+1).padStart(2,"0")).includes(q.toLowerCase())?"1":".2")}
function addNode(){const c=$("#workflowCanvas");const n=document.createElement("div");n.className="workflow-node";n.innerHTML="<b>人工审批</b><small>等待人工确认</small>";c.insertBefore(n,c.lastElementChild);$("#nodeCount").textContent=String(Number($("#nodeCount").textContent)+1);$("#edgeCount").textContent=String(Number($("#edgeCount").textContent)+1);notify("已添加审批节点（本地演示）")}
function render(){const root=$("#pageRoot");if(route==="/workspace/overview")root.innerHTML=dashboard();else if(route==="/workspace/office")root.innerHTML=office();else if(route==="/workspace/tasks")root.innerHTML=tasksPage();else if(route==="/workspace/collaboration")root.innerHTML=collaboration();else if(route==="/admin/workflows")root.innerHTML=workflow();else if(route==="/workspace/quality-cost")root.innerHTML=cost();else if(route==="/admin/settings")root.innerHTML=settings();else root.innerHTML=dashboard();document.querySelectorAll("[data-route]").forEach(a=>a.classList.toggle("on",a.dataset.route===route));if(route==="/workspace/tasks")renderTaskTable()}
window.addEventListener("hashchange",()=>{route=location.hash.slice(1)||"/workspace/overview";render()});
$("#collapseBtn").addEventListener("click",()=>{$("#appShell").classList.toggle("nav-collapsed");const c=$("#appShell").classList.contains("nav-collapsed");$("#collapseBtn").querySelector("i").textContent=c?"»":"«";$("#collapseBtn").querySelector("span").textContent=c?"展开侧边栏":"收起侧边栏"});
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();const q=$("#globalSearch").value.trim();if(!q)return;route="/workspace/tasks";location.hash=route;render();$("#taskSearch").value=q;renderTaskTable()});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#globalSearch").focus()}if(e.key==="Escape")closeCreate()});
$("#themeBtn").addEventListener("click",()=>notify("主题切换由生产系统设置控制"));
$("#userBtn").addEventListener("click",()=>notify("演示模式未连接用户会话"));
$("#cancelCreate").addEventListener("click",closeCreate);
$("#taskModal").addEventListener("click",e=>{if(e.target.id==="taskModal")closeCreate()});
$("#createTaskForm").addEventListener("submit",e=>{e.preventDefault();const title=$("#taskTitle").value.trim();if(!title)return;sampleTasks.unshift({id:"tsk_DEMO_"+String(sampleTasks.length+1).padStart(2,"0"),title,agent:$("#taskAgent").value,status:"queued",priority:"普通",updated:"刚刚"});closeCreate();$("#createTaskForm").reset();route="/workspace/tasks";location.hash=route;render();notify("演示任务已创建，仅保存在当前页面")});
render();
</script></body></html>
